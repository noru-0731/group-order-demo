<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공동 발주 시연</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f6f7f4;--card:#fff;--line:#e6e8e3;--ink:#15181a;--sub:#6d726b;--mute:#a3a8a0;--g:#16a05c;--g2:#e7f6ee;--g3:#c9ebd8;--r:14px;--spring:cubic-bezier(.3,1.35,.5,1);--out:cubic-bezier(.2,.9,.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:430px 1fr;height:100vh;transition:grid-template-columns .65s cubic-bezier(.65,0,.2,1)}
.app.hide{grid-template-columns:0px 1fr}
.stage{min-width:0;overflow:hidden}
.phone{transition:transform .65s cubic-bezier(.65,0,.2,1),opacity .5s}
.app.hide .phone{transform:translateX(-110%) scale(.92);opacity:0}
.tog{position:fixed;top:50%;left:430px;z-index:60;width:26px;height:64px;margin-top:-32px;border-radius:0 14px 14px 0;background:#fff;border:1px solid var(--line);border-left:0;box-shadow:4px 0 14px -8px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--sub);transition:left .65s cubic-bezier(.65,0,.2,1),color .2s,width .25s var(--spring)}
.tog:hover{color:var(--g);width:32px}
.tog svg{width:18px;height:18px;transition:transform .5s var(--spring)}
.app.hide~.tog svg{transform:rotate(180deg)}
.app.hide~.tog{left:0}

/* roll */
.roll{display:inline-flex;white-space:nowrap}
.rd{display:inline-block;height:1.1em;overflow:hidden;line-height:1.1em}
.rc{display:flex;flex-direction:column;transition:transform .9s var(--out)}
.rc span{height:1.1em;line-height:1.1em;text-align:center}
.rs{line-height:1.1em}

/* keyframes */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}
@keyframes bump{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-50%) scale(1.35)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes rip{from{width:10px;height:10px;opacity:1}to{width:90px;height:90px;opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,160,92,.55)}100%{box-shadow:0 0 0 9px rgba(22,160,92,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hl{0%{background:#d9f2e4}100%{background:transparent}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(22,160,92,.6)}100%{box-shadow:0 0 0 14px rgba(22,160,92,0)}}

/* card + skeleton */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:relative;transition:transform .3s var(--out),box-shadow .3s;animation:up .6s var(--out) both;animation-delay:var(--d,0ms)}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(20,40,25,.28)}
.card>*{transition:opacity .5s}
body.loading .card>*{opacity:0}
body.loading .card::after{content:"";position:absolute;inset:14px;border-radius:10px;background:linear-gradient(90deg,#f0f1ed 25%,#f8f9f6 50%,#f0f1ed 75%);background-size:200% 100%;animation:shim 1.1s linear infinite}

/* progress bar */
.bar{height:8px;border-radius:99px;background:#eef0ec;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#2cc277,#16a05c);transition:width 1.2s var(--out);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sheen 2.4s ease-in-out infinite}

.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--g2);color:var(--g)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.avs{display:flex;align-items:center}
.avs .av{width:24px;height:24px;border:2px solid #fff;margin-left:-9px;transition:margin .35s var(--spring)}
.avs .av:first-child{margin-left:0}
.avs:hover .av{margin-left:3px}
.avs .more{font-size:11px;color:var(--sub);font-weight:700;margin-left:6px}

/* seg */
.seg{position:relative;display:flex;background:#eef0ec;border-radius:12px;padding:3px}
.seg button{flex:1;position:relative;z-index:1;padding:7px 12px;font-size:13px;font-weight:600;color:var(--sub);transition:color .3s;white-space:nowrap}
.seg button.on{color:var(--ink)}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:left .45s var(--spring),width .45s var(--spring)}

/* ===== phone ===== */
.stage{display:grid;place-items:center;background:radial-gradient(circle at 30% 15%,#fff 0,#eceee9 70%);border-right:1px solid var(--line)}
.phone{width:372px;height:min(790px,calc(100vh - 36px));border-radius:54px;background:#121412;padding:10px;box-shadow:0 40px 70px -30px rgba(20,35,25,.45),inset 0 0 0 2px #2c2f2c}
.screen{position:relative;height:100%;border-radius:44px;background:#f9faf8;overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:108px;height:32px;border-radius:20px;background:#000;z-index:30;color:#fff;overflow:hidden;transition:width .55s var(--spring),height .55s var(--spring),border-radius .55s}
.island.big{width:340px;height:74px;border-radius:30px}
.island .ic{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 18px;opacity:0;transition:opacity .25s}
.island.big .ic{opacity:1;transition-delay:.2s}
.ic .em{font-size:28px}
.ic b{font-size:14px;display:block}
.ic small{font-size:12px;color:#9ee6bd;font-weight:600}
.ic .bar{flex:1;height:6px;background:#2b2b2b;margin-top:6px;width:120px}
.sbar{height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0;font-size:14px;font-weight:700}
.phead{display:flex;align-items:center;gap:8px;padding:4px 20px 12px}
.phead h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.bell{margin-left:auto;width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;position:relative}
.bell.wob svg{animation:wob .8s}
.bell .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#ff5a4e;border:2px solid #fff;transform:scale(0);transition:transform .4s var(--spring)}
.bell.has .dot{transform:scale(1)}
.panes{flex:1;overflow:hidden;position:relative}
.track{display:flex;width:300%;height:100%;transition:transform .6s cubic-bezier(.65,0,.2,1)}
.pane{width:33.3333%;height:100%;overflow-y:auto;padding:2px 16px 18px;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.pane.show .stag{animation:up .55s var(--out) both;animation-delay:calc(var(--i,0)*70ms)}
.tabbar{height:78px;display:flex;position:relative;border-top:1px solid var(--line);background:#fff;padding:8px 14px 22px}
.tabbar .pill{position:absolute;top:8px;height:48px;border-radius:16px;background:var(--g2);transition:left .5s var(--spring),width .5s var(--spring)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);transition:color .3s,transform .15s}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--g)}

.hero{padding:18px 18px 0;overflow:hidden}
.hero .lb{font-size:13px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.hero .num{font-size:36px;font-weight:800;letter-spacing:-1px;margin-top:6px;display:flex;align-items:baseline;gap:4px}
.hero .num small{font-size:16px;color:var(--sub);font-weight:700}
.hero svg{display:block;width:calc(100% + 36px);margin:8px -18px 0;height:96px}
.ln{fill:none;stroke:var(--g);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;transition:d .8s var(--out)}
body:not(.loading) .ln{animation:draw 1.6s var(--out) .2s forwards}
.ln.drawn{stroke-dasharray:none;animation:none}
.ar{transition:d .8s var(--out);opacity:0}
body:not(.loading) .ar{animation:fadein 1s .8s forwards}
.pills{display:flex;gap:8px;margin:14px 0 18px;overflow-x:auto;scrollbar-width:none}
.pb{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;transition:transform .18s var(--spring),background .2s}
.pb:hover{background:#f3f4f0}
.pb:active{transform:scale(.92)}
.pb.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.pb svg{width:16px;height:16px}
.sec{font-size:14px;font-weight:800;margin:4px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.sec span{font-size:12px;color:var(--mute);font-weight:600}
.mini{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px}
.tile{width:44px;height:44px;border-radius:13px;background:#f2f4ef;display:grid;place-items:center;font-size:24px;flex:none;transition:transform .4s var(--spring),background .3s}
.mini .mb{flex:1;min-width:0}
.mini .mt{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:7px}
.mini .mt .roll{color:var(--g)}
.dd{font-size:11px;font-weight:800;color:#e0542e;background:#fdece6;padding:3px 7px;border-radius:7px}

/* order */
.pane.order{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
.olist{flex:1;overflow-y:auto;margin:12px -16px 0;padding:0 16px 10px;scrollbar-width:none}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;transition:border-color .3s,background .3s,transform .3s var(--out),box-shadow .3s}
.row.has{border-color:var(--g3);background:#fbfefc}
.row.has .tile{background:var(--g2);transform:rotate(-6deg) scale(1.05)}
.row.flash{animation:flash .9s}
.row .inf{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:700;white-space:nowrap}
.row .nm small{font-size:11px;color:var(--mute);font-weight:600;margin-left:4px}
.row .pr{white-space:nowrap;font-size:12.5px;margin-top:3px;display:flex;gap:6px;align-items:center}
.row .pr b{font-weight:800}
.row .pr s{color:var(--mute)}
.row .pr em{font-style:normal;color:var(--g);font-weight:800;font-size:11px}
.step{display:flex;align-items:center;background:#f1f2ee;border-radius:12px;padding:3px}
.step button{width:30px;height:30px;border-radius:9px;font-size:18px;font-weight:700;display:grid;place-items:center;transition:background .2s,transform .15s var(--spring)}
.step button:hover{background:#fff}
.step button:active{transform:scale(.8)}
.step .q{width:40px;text-align:center;font-weight:800;font-size:15px;display:flex;justify-content:center}
.sum{border-top:1px solid var(--line);background:#fff;margin:0 -16px;padding:12px 18px 14px}
.sum .sl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:4px}
.sum .sl .roll{font-size:18px;font-weight:800;color:var(--ink)}
.sum .sl.sv .roll{color:var(--g);font-size:15px}
.hold{position:relative;display:block;margin:10px auto 0;width:100%;height:54px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;overflow:hidden;transition:width .5s cubic-bezier(.6,0,.2,1),border-radius .5s,transform .2s var(--spring),opacity .3s,background .3s;touch-action:none;user-select:none}
.hold .fill{position:absolute;inset:0;background:var(--g);transform-origin:left;transform:scaleX(0);transition:transform .35s ease-out}
.hold.pressing{transform:scale(.97)}
.hold.pressing .fill{transform:scaleX(1);transition:transform 1.1s linear}
.hold .lbl{position:relative;transition:opacity .2s}
.hold.off{opacity:.35}
.hold.shake{animation:shake .45s}
.hold.loading,.hold.done{width:54px;border-radius:27px;background:var(--g)}
.hold.loading .lbl,.hold.done .lbl{opacity:0}
.hold .spn{position:absolute;inset:15px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;opacity:0}
.hold.loading .spn{opacity:1;animation:spin .7s linear infinite}
.hold .ok{position:absolute;inset:0;margin:auto;width:26px;height:26px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.hold.done .ok{animation:draw .45s var(--out) forwards}

.scrim{position:absolute;inset:0;background:rgba(12,18,14,.38);opacity:0;pointer-events:none;transition:opacity .4s;z-index:19;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:26px 22px 28px;transform:translateY(105%);transition:transform .65s cubic-bezier(.2,1.15,.3,1);z-index:20;text-align:center}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#e2e4df;margin:-12px auto 18px}
.ck{width:68px;height:68px;border-radius:50%;background:var(--g);margin:0 auto 14px;display:grid;place-items:center;transform:scale(0)}
.sheet.show .ck{animation:pop .6s var(--spring) .25s forwards}
.ck svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.sheet.show .ck svg{animation:draw .5s var(--out) .65s forwards}
.sheet h3{font-size:22px;font-weight:800}
.rcpt{margin:18px 0;text-align:left;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rcpt .top{background:var(--g2);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.rcpt .top span{font-size:13px;font-weight:700;color:var(--g)}
.rcpt .top .roll{font-size:24px;font-weight:800;color:var(--g)}
.rcpt .li{display:flex;justify-content:space-between;padding:9px 16px;font-size:13.5px;border-top:1px solid #f0f1ed;opacity:0}
.sheet.show .rcpt .li{animation:up .4s var(--out) forwards;animation-delay:calc(.7s + var(--i)*80ms)}
.rcpt .li b{font-weight:700}
.sheet .go{width:100%;height:52px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;transition:transform .15s}
.sheet .go:active{transform:scale(.96)}
.cf{position:absolute;width:8px;height:12px;border-radius:2px;z-index:25;pointer-events:none}

/* farms */
.fc{padding:14px;margin-bottom:10px;cursor:pointer}
.fc .ft{display:flex;gap:12px;align-items:center}
.fc .fn{flex:1;min-width:0}
.fc .fn b{font-size:15px;font-weight:800;display:block}
.fc .fn span{font-size:12px;color:var(--sub);font-weight:600}
.fc .chev{width:18px;height:18px;color:var(--mute);transition:transform .45s var(--spring)}
.fc.open .chev{transform:rotate(180deg)}
.fc .pg{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 7px}
.fc .pg .roll{font-size:22px;font-weight:800;color:var(--g)}
.fc .pg small{font-size:12px;color:var(--sub);font-weight:600}
.fc .bar{height:10px}
.fc .fb{display:flex;justify-content:space-between;align-items:center;margin-top:11px}
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--out)}
.fc.open .ex{grid-template-rows:1fr}
.ex>div{overflow:hidden}
.exg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.exg div{background:#f5f6f2;border-radius:11px;padding:9px 10px}
.exg small{font-size:11px;color:var(--sub);font-weight:600;display:block}
.exg b{font-size:14px;font-weight:800}
.join{width:100%;margin-top:10px;height:44px;border-radius:13px;background:var(--g);color:#fff;font-weight:800;transition:transform .15s var(--spring)}
.join:active{transform:scale(.95)}

/* ===== admin ===== */
.admin{display:grid;grid-template-columns:76px 1fr;height:100vh;overflow:hidden;background:#fbfbf9}
.side{border-right:1px solid var(--line);background:#fff;padding:18px 0;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.logo{width:40px;height:40px;border-radius:12px;background:var(--g);display:grid;place-items:center;color:#fff;margin-bottom:18px;transition:transform .5s var(--spring)}
.logo:hover{transform:rotate(-12deg) scale(1.08)}
.nv{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:var(--mute);position:relative;z-index:1;transition:color .3s,transform .15s}
.nv:hover{color:var(--ink)}
.nv:active{transform:scale(.88)}
.nv.on{color:var(--g)}
.nvp{position:absolute;left:15px;width:46px;height:46px;border-radius:13px;background:var(--g2);transition:top .5s var(--spring)}
.nv[data-t]:hover::after{content:attr(data-t);position:absolute;left:56px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap;animation:up .25s}
.main{overflow-y:auto;padding:0 26px 30px;scrollbar-width:thin}
.topb{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:12px;height:66px;background:rgba(251,251,249,.86);backdrop-filter:blur(10px);margin:0 -26px;padding:0 26px}
.search{display:flex;align-items:center;gap:8px;height:40px;width:230px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;color:var(--mute);transition:width .4s var(--spring),box-shadow .3s,border-color .3s}
.search:focus-within{width:330px;box-shadow:0 0 0 4px var(--g2);border-color:#9fd8b8;color:var(--g)}
.search input{border:0;outline:0;font:inherit;font-size:14px;flex:1;min-width:0;background:none;color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--g);background:var(--g2);padding:6px 11px;border-radius:99px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--g);animation:pulse 1.4s infinite}
.live.pz i{animation:none;background:var(--mute)}
.clock{font-size:13px;color:var(--sub);font-weight:700}
.topb .seg{margin-left:auto;width:240px}
.ttl{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.ttl h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-right:8px}
.apb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;position:relative;overflow:hidden;transition:transform .18s var(--spring),background .2s}
.apb:hover{background:#f3f4f0}
.apb:active{transform:scale(.93)}
.apb.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.apb svg{width:16px;height:16px}
.wave{position:absolute;border-radius:50%;background:rgba(22,160,92,.25);transform:scale(0);animation:wv .6s ease-out forwards;pointer-events:none}
@keyframes wv{to{transform:scale(4);opacity:0}}

.r1{display:grid;grid-template-columns:1.75fr 1fr;gap:16px}
.big{padding:20px 22px 0;overflow:hidden}
.big .lb{font-size:13px;font-weight:700;color:var(--sub);display:flex;justify-content:space-between}
.big .num{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.big .num .roll{font-size:42px;font-weight:800;letter-spacing:-1.5px}
.big .num small{font-size:17px;color:var(--sub);font-weight:700;margin-right:6px}
.chart{position:relative;height:150px;margin:10px -22px 0}
.chart svg{width:100%;height:100%;display:block}
.chart .vl{position:absolute;top:0;bottom:0;width:1px;background:repeating-linear-gradient(to bottom,#c3c8c0 0 4px,transparent 4px 8px);opacity:0;transition:left .18s var(--out),opacity .2s;pointer-events:none}
.chart .dt{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--g);transform:translate(-50%,-50%);opacity:0;transition:left .18s var(--out),top .18s var(--out),opacity .2s;pointer-events:none}
.chart .tp{position:absolute;top:4px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;opacity:0;white-space:nowrap;transition:left .18s var(--out),opacity .2s;pointer-events:none}
.chart:hover .vl,.chart:hover .dt,.chart:hover .tp{opacity:1}
.xl{display:flex;justify-content:space-between;padding:6px 22px 14px;font-size:11px;color:var(--mute);font-weight:600;margin:0 -22px}
.stats{display:grid;grid-template-rows:repeat(3,1fr);gap:12px}
.st{padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.st small{font-size:12.5px;color:var(--sub);font-weight:700;display:block;margin-bottom:4px}
.st .roll{font-size:25px;font-weight:800;letter-spacing:-.5px}
.st svg{width:96px;height:38px}
.st svg path{fill:none;stroke:var(--g);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;vector-effect:non-scaling-stroke}
body:not(.loading) .st svg path{animation:draw 1.4s var(--out) .5s forwards}

.r2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.mapc{padding:16px 16px 14px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch h3{font-size:15px;font-weight:800}
.lg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mute);font-weight:700}
.lg i{width:90px;height:7px;border-radius:9px;background:linear-gradient(90deg,#e6f4ea 0 20%,#bfe5cc 20% 40%,#8fd1a9 40% 60%,#4fb07c 60% 80%,#1f8a52 80%)}
.mgrid{display:grid;grid-template-columns:1fr 52px;gap:10px}
.mapbox{position:relative;overflow:hidden;border-radius:12px;background:#f7f8f5}
.mapwrap{position:relative;width:min(100%,540px);margin:0 auto;aspect-ratio:800/658;transform-origin:96% 50%;transition:transform .7s var(--out)}
.mapbox.detail .mapwrap{transform:scale(.64)}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mapwrap path{stroke:#fff;stroke-width:1.6;transition:fill .8s var(--out),transform .35s var(--spring),filter .35s;cursor:pointer;transform-box:fill-box;transform-origin:center}
.mapwrap path:hover{transform:translateY(-4px) scale(1.03);filter:drop-shadow(0 8px 8px rgba(10,60,30,.28))}
.mapwrap path.sel{stroke:var(--ink);stroke-width:2.4;filter:drop-shadow(0 8px 10px rgba(10,60,30,.35));transform:translateY(-4px) scale(1.04)}
.pin{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:7px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.14);pointer-events:none;color:var(--ink)}
.pin.bump{animation:bump .7s var(--spring)}
.pin.me{background:var(--ink);color:#fff}
.rip{position:absolute;border-radius:50%;border:2.5px solid var(--g);transform:translate(-50%,-50%);animation:rip 1.3s ease-out forwards;pointer-events:none}
.tip{position:fixed;z-index:50;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:7px 10px;border-radius:9px;pointer-events:none;opacity:0;transform:translate(12px,12px) scale(.9);transition:opacity .15s,transform .2s var(--spring)}
.tip.on{opacity:1;transform:translate(12px,12px) scale(1)}
.tip span{color:#9ee6bd;margin-left:6px}
.dp{position:absolute;left:10px;top:10px;bottom:10px;width:184px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;transform:translateX(-120%);opacity:0;transition:transform .6s cubic-bezier(.2,1.2,.3,1),opacity .3s;z-index:3;box-shadow:0 12px 30px -16px rgba(0,0,0,.3);display:flex;flex-direction:column}
.mapbox.detail .dp{transform:none;opacity:1}
.dp .x{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--mute);transition:background .2s,transform .3s var(--spring)}
.dp .x:hover{background:#f1f2ee;transform:rotate(90deg)}
.dp h4{font-size:17px;font-weight:800}
.dp .roll{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.dp .u{font-size:12px;color:var(--sub);font-weight:700}
.wb{display:flex;align-items:flex-end;gap:5px;height:64px;margin:14px 0 4px}
.wb i{flex:1;background:var(--g3);border-radius:4px 4px 2px 2px;height:0;transition:height .7s var(--spring)}
.wb i:last-child{background:var(--g)}
.wl{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mute);font-weight:700}
.tops{margin-top:auto;display:flex;flex-direction:column;gap:7px}
.tops div{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.tops .bar{flex:1;height:6px}
.rail{display:flex;flex-direction:column;gap:6px;position:relative}
.rb{width:52px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:21px;position:relative;z-index:1;transition:transform .2s var(--spring),filter .3s;filter:grayscale(.7);opacity:.75}
.rb:hover{transform:scale(1.1);filter:none;opacity:1}
.rb.on{filter:none;opacity:1}
.rb.all{font-size:12px;font-weight:800}
.rlp{position:absolute;left:0;width:52px;height:46px;border-radius:12px;background:var(--g2);box-shadow:inset 0 0 0 1.5px var(--g3);transition:top .5s var(--spring)}

.feedc{padding:16px 0 6px;display:flex;flex-direction:column;overflow:hidden}
.feedc .ch{padding:0 16px}
.feedc .ch .roll{font-size:13px;font-weight:800;color:var(--sub)}
.feed{flex:1;overflow:hidden;position:relative}
.feed::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,#fff);pointer-events:none}
.fi{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--out)}
.fi.in{grid-template-rows:1fr}
.fi>div{overflow:hidden}
.fr{display:flex;align-items:center;gap:10px;padding:10px 16px;border-left:3px solid transparent;transform:translateX(-20px);opacity:0;transition:transform .5s var(--out),opacity .4s}
.fi.in .fr{transform:none;opacity:1}
.fi.in.hl .fr{animation:hl 2.6s ease-out}
.fi.mine .fr{border-left-color:var(--g);background:#f3fbf6}
.fr .tx{flex:1;min-width:0}
.fr .tx b{font-size:13.5px;font-weight:800;display:block}
.fr .tx span{font-size:12px;color:var(--sub);font-weight:600}
.fr .q{text-align:right;font-size:14px;font-weight:800;color:var(--g)}
.fr .q small{display:block;font-size:11px;color:var(--mute);font-weight:600}

.r3{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.lc{padding:16px 18px}
.bars{display:flex;flex-direction:column;gap:4px}
.br{display:grid;grid-template-columns:22px 62px 1fr 74px;align-items:center;gap:8px;padding:5px 6px;border-radius:9px;font-size:13px;font-weight:700}
.br.upd{animation:hl 1.6s}
.br .rk{font-size:12px;color:var(--mute);font-weight:800;text-align:center}
.br:nth-child(-n+3) .rk{color:var(--g)}
.br .bt{height:10px;border-radius:6px;background:#f0f1ed;overflow:hidden}
.br .bt i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#8fd6af,#16a05c);transition:width .9s var(--out)}
.br .roll{justify-content:flex-end;font-size:12.5px}
.fl{display:flex;flex-direction:column;gap:12px}
.fl .it{display:grid;grid-template-columns:34px 1fr 46px;gap:10px;align-items:center}
.fl .tile{width:34px;height:34px;font-size:18px;border-radius:10px}
.fl .it b{font-size:13px;font-weight:800;display:block;margin-bottom:5px}
.fl .it .roll{font-size:13px;font-weight:800;color:var(--g);justify-content:flex-end}

/* ===== admin calm ===== */
.admin{--ease:cubic-bezier(.2,.8,.2,1)}
.admin .card{animation-duration:.4s}
.admin .card:hover{transform:none;box-shadow:none}
.admin .logo:hover{transform:none}
.admin .nvp{transition:top .25s var(--ease)}
.admin .nv:active,.admin .apb:active{transform:scale(.97)}
.admin .search,.admin .search:focus-within{width:260px;transition:box-shadow .2s,border-color .2s}
.admin .seg .th{transition:left .25s var(--ease),width .25s var(--ease)}
.admin .rc{transition-duration:.45s}
.admin .bar i{transition:width .45s var(--ease)}
.admin .bar i::after{display:none}
.admin .mapwrap path{transition:fill .4s ease,stroke .15s}
.admin .mapwrap path:hover{transform:none;filter:none;stroke:var(--ink);stroke-width:2}
.admin .mapwrap path.sel{transform:none;filter:none;stroke:var(--ink);stroke-width:2.6}
.admin .mapbox.detail .mapwrap{transform:none}
.admin .dp{transition:transform .3s var(--ease),opacity .25s}
.admin .wb i{transition:height .4s var(--ease)}
.admin .rb{transition:filter .2s,opacity .2s}
.admin .rb:hover{transform:none}
.admin .rlp{transition:top .25s var(--ease)}
.admin .fi{transition:grid-template-rows .35s var(--ease)}
.admin .fr{transform:none;transition:opacity .3s}
.admin .br .bt i{transition:width .45s var(--ease)}
.tip{transition:opacity .12s}
.tip,.tip.on{transform:translate(12px,12px)}
</style>
</head>

/* chart path */
function paths(v,w,h,pt=10,sc){
  if(sc&&Math.max(...v)>sc[1])sc[1]=Math.max(...v)*1.2;
  const mx=sc?sc[1]:Math.max(...v)*1.08,mn=sc?sc[0]:Math.min(...v)*.55;
  const P=v.map((x,i)=>[+(i/(v.length-1)*w).toFixed(1),+(h-pt-(x-mn)/(mx-mn)*(h-pt*2)).toFixed(1)]);
  let d=`M${P[0]}`;
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    const c1=[(p1[0]+(p2[0]-p0[0])/6).toFixed(1),(p1[1]+(p2[1]-p0[1])/6).toFixed(1)],c2=[(p2[0]-(p3[0]-p1[0])/6).toFixed(1),(p2[1]-(p3[1]-p1[1])/6).toFixed(1)];
    d+=`C${c1} ${c2} ${p2}`}
  return{line:d,area:d+`L${w},${h}L0,${h}Z`,P};
}
const setD=(el,d)=>el.style.d=`path("${d}")`;

  bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.classList.remove('on'));b.classList.add('on');place(b);cb&&cb(i)});
  requestAnimationFrame(()=>place($('button.on',el)));
  return()=>place($('button.on',el));
}

  list.forEach(([g,v],i)=>{let r=box.querySelector(`[data-g="${g}"]`);
    if(!r){r=document.createElement('div');r.className='br';r.dataset.g=g;r.innerHTML=`<b class="rk"></b><span>${g}</span><div class="bt"><i></i></div><span class="vv"></span>`;r.style.animation='up .5s var(--out) both'}
    box.appendChild(r);$('.rk',r).textContent=i+1;const bi=$('.bt i',r);requestAnimationFrame(()=>bi.style.width=(v/mx*100)+'%');roll($('.vv',r),v,n=>fmt(n)+'kg')});
  $$('.br',box).forEach(r=>{const o=old.get(r.dataset.g);if(o==null)return;const dy=o-r.getBoundingClientRect().top;if(Math.abs(dy)<1)return;
    r.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'});if(dy>0){r.classList.remove('upd');void r.offsetWidth;r.classList.add('upd')}});
}

// feed
const feed=$('#feed');
function addFeed(o,instant){
  const li=document.createElement('div');li.className='fi'+(o.mine?' mine':'');li.dataset.t=o.t;
  li.innerHTML=`<div><div class="fr"><span class="av" style="background:${col(o.store)}">${o.store[0]}</span><div class="tx"><b>${o.store}</b><span>${o.gu} · ${IT[o.item].e} ${IT[o.item].n}</span></div><div class="q">+${o.qty}kg<small></small></div></div></div>`;
  feed.prepend(li);
  if(instant)li.classList.add('in');else requestAnimationFrame(()=>requestAnimationFrame(()=>li.classList.add('in','hl')));
  while(feed.children.length>10)feed.lastChild.remove();ftime();
}
function ftime(){const now=Date.now();$$('.fi',feed).forEach(li=>{const s=Math.floor((now-li.dataset.t)/1000);$('small',li).textContent=s<5?'방금':s<60?s+'초 전':Math.floor(s/60)+'분 전'})}

function renderAdmin(){renderBig();renderStats();renderMap();S.barsDirty=true;renderDetail();roll($('#fCnt'),S.orders,n=>'오늘 '+fmt(n)+'건')}

/* order event */
function order(o){
  o.t=o.t||Date.now();
  vol[o.gu][o.item]+=o.qty;gw[o.gu][6]+=o.qty;SER.forEach(s=>s[N-1]+=o.qty*(.6+R()*.6));
  const f=FARMS.find(f=>f.it===o.item);if(f)f.cur+=o.qty;
  S.orders++;S.saved+=o.qty*(IT[o.item].m-IT[o.item].p);if(R()<.25)S.stores++;
  renderAdmin();ripple(o.gu);addFeed(o);renderFarms();renderHome();
}
function randOrder(){
  const tot=total();let x=R()*tot,g=GUS[0];for(const k of GUS){x-=guTot(k);if(x<=0){g=k;break}}
  const it=ITEMS[Math.floor(R()*ITEMS.length)].id;let st=STORES[1+Math.floor(R()*(STORES.length-1))];
  order({store:st,gu:g,item:it,qty:5*(1+Math.floor(R()*8))});
}
setInterval(()=>{if(!S.paused&&!document.hidden)randOrder()},4200);
setInterval(()=>{if(S.barsDirty){S.barsDirty=false;renderBars()}},5000);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='g'||e.key==='G'){for(let i=0;i<14;i++)setTimeout(randOrder,i*260)}
  if(e.key==='p'||e.key==='P'){S.paused=!S.paused}
});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();const g=GUS.find(g=>v&&g.includes(v));if(g){select(g);e.target.blur()}}});

/* clock */
function clock(){const d=new Date(),p=n=>String(n).padStart(2,'0');$('#clock').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;$('#ptime').textContent=`${d.getHours()}:${p(d.getMinutes())}`;ftime()}
setInterval(clock,1000);clock();

const togPhone=()=>{$('.app').classList.toggle('hide');setTimeout(()=>window.dispatchEvent(new Event('resize')),700)};
$('#tog').onclick=togPhone;
document.addEventListener('keydown',e=>{if(e.target.tagName!=='INPUT'&&(e.key==='h'||e.key==='H'))togPhone()});
document.querySelectorAll('.ln').forEach(l=>l.addEventListener('animationend',()=>l.classList.add('drawn')));
/* boot */
for(let i=7;i>0;i--){const it=ITEMS[i%6].id;addFeed({store:STORES[i*3%STORES.length],gu:GUS[i*5%25],item:it,qty:5*(1+i%7),t:Date.now()-i*47000},true)}
renderOrder();placeTab();
setTimeout(()=>{document.body.classList.remove('loading');renderHome();renderAdmin();renderBars();S.barsDirty=false;renderFarms()},950);
window.addEventListener('resize',()=>{placeTab();placeNv($('.nv.on'));placeRl($('.rb.on'))});
</script>
</body>
</html>
