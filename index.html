<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOP 공동발주 시연</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<style>
:root{--bg:#f6f7f4;--card:#fff;--line:#e6e8e3;--ink:#15181a;--sub:#6d726b;--mute:#a3a8a0;--g:#16a05c;--g2:#e7f6ee;--g3:#c9ebd8;--r:14px;--spring:cubic-bezier(.3,1.35,.5,1);--out:cubic-bezier(.2,.9,.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root{--colw:430px;--ps:1;--az:1}
.app{display:grid;grid-template-columns:var(--colw) 1fr;height:100vh;transition:grid-template-columns .65s cubic-bezier(.65,0,.2,1)}
.app.hide{grid-template-columns:0px 1fr}
.stage{min-width:0;overflow:hidden;position:relative}
.phone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--ps));transition:transform .65s cubic-bezier(.65,0,.2,1),opacity .5s}
.app.hide .phone{transform:translate(-50%,-50%) translateX(-110%) scale(calc(var(--ps) * .92));opacity:0}
.tog{position:fixed;top:50%;left:var(--colw);z-index:60;width:26px;height:64px;margin-top:-32px;border-radius:0 14px 14px 0;background:#fff;border:1px solid var(--line);border-left:0;box-shadow:4px 0 14px -8px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--sub);transition:left .65s cubic-bezier(.65,0,.2,1),color .2s,width .25s var(--spring)}
.tog:hover{color:var(--g);width:32px}
.tog svg{width:18px;height:18px;transition:transform .5s var(--spring)}
.app.hide~.tog svg{transform:rotate(180deg)}
.app.hide~.tog{left:0}

/* roll */
.roll{display:inline-flex;white-space:nowrap}
.rd{display:inline-block;height:1.1em;overflow:hidden;line-height:1.1em}
.rc{display:flex;flex-direction:column;transition:transform .9s var(--out)}
.rc span{height:1.1em;line-height:1.1em;text-align:center}
.rs{line-height:1.1em;white-space:pre}

/* keyframes */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}
@keyframes rip{from{width:10px;height:10px;opacity:1}to{width:90px;height:90px;opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,160,92,.55)}100%{box-shadow:0 0 0 9px rgba(22,160,92,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hl2{from{background:#eff8f3}}
@keyframes hlm{0%,50%{background:#16a05c;color:#fff}64%,100%{background:#e4f5eb}}
.fi.mine.in.hl .fr>*{animation:hlmt 1.4s linear}
@keyframes hlmt{0%,86%{color:#fff}}
@keyframes rowfl{from{background:#dcf2e5;border-color:var(--g)}}
@keyframes ddin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes store-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* card + skeleton */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:relative;transition:transform .3s var(--out),box-shadow .3s;animation:up .6s var(--out) both;animation-delay:var(--d,0ms)}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(20,40,25,.28)}
.card>*{transition:opacity .5s}
body.loading .card>*{opacity:0}
body.loading .card::after{content:"";position:absolute;inset:14px;border-radius:10px;background:linear-gradient(90deg,#f0f1ed 25%,#f8f9f6 50%,#f0f1ed 75%);background-size:200% 100%;animation:shim 1.1s linear infinite}

/* progress bar */
.bar{height:8px;border-radius:99px;background:#eef0ec;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#2cc277,#16a05c);transition:width 1.2s var(--out);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sheen 2.4s ease-in-out infinite}

.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--g2);color:var(--g)}
.av{width:34px;height:34px;border-radius:11px;background:var(--g2);display:grid;place-items:center;flex:none}
.av img{width:26px;height:26px;display:block;user-select:none}

/* ===== phone ===== */
.stage{display:grid;place-items:center;background:radial-gradient(circle at 30% 15%,#fff 0,#eceee9 70%);border-right:1px solid var(--line)}
.phone{width:372px;height:790px;border-radius:54px;background:#121412;padding:10px;box-shadow:0 40px 70px -30px rgba(20,35,25,.45),inset 0 0 0 2px #2c2f2c}
.screen{position:relative;height:100%;border-radius:44px;background:#f9faf8;overflow:hidden;display:flex;flex-direction:column}
.sbar{height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0;font-size:14px;font-weight:700}
.sic{display:flex;align-items:center;gap:6px}
.sic svg{display:block;fill:var(--ink)}
.phead{display:flex;align-items:center;gap:8px;padding:4px 20px 12px}
.phead h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.panes{flex:1;min-height:0;overflow:hidden;overflow:clip;position:relative}
.track{display:flex;width:200%;height:100%;transition:transform .6s cubic-bezier(.65,0,.2,1)}
.pane{width:50%;height:100%;overflow-y:auto;padding:2px 16px 18px;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.pane.show .stag{animation:up .55s var(--out) both;animation-delay:calc(var(--i,0)*70ms)}
.tabbar{height:78px;display:flex;position:relative;border-top:1px solid var(--line);background:#fff;padding:8px 14px 22px}
.tabbar .pill{position:absolute;top:8px;height:48px;border-radius:16px;background:var(--g2);transition:left .5s var(--spring),width .5s var(--spring)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);transition:color .3s,transform .15s}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--g)}

.tile{width:44px;height:44px;border-radius:13px;background:#f2f4ef;display:grid;place-items:center;flex:none;transition:transform .4s var(--spring),background .3s}
.tile img{width:34px;height:34px;display:block;user-select:none;pointer-events:none}
.dd{font-size:11px;font-weight:800;color:#7c8179;background:#eff0ec;padding:3px 7px;border-radius:7px;white-space:nowrap}
.dd.ok{color:#fff;background:var(--g);animation:ddin .18s ease-out}
.dds{display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:flex-start}

/* order */
.pane.order{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
.olist{flex:1;overflow-y:auto;margin:12px -16px 0;padding:0 16px 10px;scrollbar-width:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 12px 12px;margin-bottom:8px;transition:border-color .3s,background .3s,transform .3s var(--out),box-shadow .3s}
.row.has{border-color:var(--g3);background:#fbfefc}
.row.has .tile{background:var(--g2);transform:rotate(-6deg) scale(1.05)}
.row .inf{flex:1;min-width:0}
.row .nm{font-size:17px;font-weight:700;white-space:nowrap}
.row .pr{white-space:nowrap;font-size:14px;margin-top:3px;letter-spacing:-.2px}
.row .pr b{font-weight:800}
.row .sp{font-size:12px;color:var(--sub);font-weight:600;margin-top:3px;white-space:nowrap}
.row .mp{flex-basis:100%;display:flex;align-items:center;gap:8px;margin-top:2px}
.row .mp .dd{flex:none}
.mb{flex:1;min-width:0;height:8px;border-radius:99px;background:#eef0ec;overflow:hidden;display:flex}
.mb i{display:block;height:100%;width:0;flex:none;transition:width .45s var(--out)}
.mb .b0{background:#a9dec0}
.mb .b1{background:var(--g)}
.mt{flex:none;font-size:13px;font-weight:800;color:#868b83;white-space:nowrap}
.mt b{color:var(--g);font-weight:800}
.mt .me{color:var(--g)}
.step{display:flex;align-items:center;background:#f1f2ee;border-radius:12px;padding:3px}
.step button{width:28px;height:30px;border-radius:9px;font-size:18px;font-weight:700;display:grid;place-items:center;transition:background .2s,transform .15s var(--spring)}
.step button:hover{background:#fff}
.step button:active{transform:scale(.8)}
.step .q{width:52px;text-align:center;font-weight:800;font-size:15px;display:flex;justify-content:center}
.step .q .rs{font-size:11.5px;color:var(--sub);align-self:flex-end;padding-bottom:1px}
.row.flash{animation:rowfl 1.6s ease-out .3s both}
.sum{border-top:1px solid var(--line);background:#fff;margin:0 -16px;padding:12px 18px 14px}
.sum .sl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:4px}
.sum .sl .roll{font-size:18px;font-weight:800;color:var(--ink)}
.hold{position:relative;display:block;margin:10px auto 0;width:100%;height:54px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;overflow:hidden;transition:width .5s cubic-bezier(.6,0,.2,1),border-radius .5s,transform .2s var(--spring),opacity .3s,background .3s;touch-action:none;user-select:none}
.hold .fill{position:absolute;inset:0;background:var(--g);transform-origin:left;transform:scaleX(0);transition:transform .35s ease-out}
.hold.pressing{transform:scale(.97)}
.hold.pressing .fill{transform:scaleX(1);transition:transform 1.1s linear}
.hold .lbl{position:relative;transition:opacity .2s}
.hold.off{opacity:.35}
.hold.shake{animation:shake .45s}
.hold.loading,.hold.done{width:54px;border-radius:27px;background:var(--g)}
.hold.loading .lbl,.hold.done .lbl{opacity:0}
.hold .spn{position:absolute;inset:15px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;opacity:0}
.hold.loading .spn{opacity:1;animation:spin .7s linear infinite}
.hold .ok{position:absolute;inset:0;margin:auto;width:26px;height:26px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.hold.done .ok{animation:draw .3s var(--out) forwards}

.scrim{position:absolute;inset:0;background:rgba(12,18,14,.38);opacity:0;pointer-events:none;transition:opacity .4s;z-index:19;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:26px 22px 28px;transform:translateY(105%);transition:transform .65s cubic-bezier(.2,1.15,.3,1);z-index:20;text-align:center}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#e2e4df;margin:-12px auto 18px}
.ck{width:68px;height:68px;border-radius:50%;background:var(--g);margin:0 auto 14px;display:grid;place-items:center;transform:scale(0)}
.sheet.show .ck{animation:pop .5s var(--spring) .1s forwards}
.ck svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.sheet.show .ck svg{animation:draw .4s var(--out) .4s forwards}
.sheet h3{font-size:22px;font-weight:800}
.rcpt{margin:18px 0;text-align:left;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rcpt .top{background:var(--g2);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rcpt .li~.top{border-top:1px solid var(--line)}
.rcpt .top .ri{font-size:15px;font-weight:800}
.rcpt .tv{display:flex;align-items:center;gap:8px;white-space:nowrap}
.rcpt .tv b{font-size:28px;font-weight:800;color:var(--g);letter-spacing:-.6px}
.rcpt .tv em{font-style:normal;font-size:12px;font-weight:800;color:#fff;background:var(--g);padding:3px 8px;border-radius:7px}
.rcpt .li{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;font-size:13.5px;border-top:1px solid #f0f1ed;opacity:0}
.rcpt .li span{color:var(--sub);font-weight:600}
.sheet.show .rcpt .li{animation:up .4s var(--out) forwards;animation-delay:calc(.4s + var(--i)*60ms)}
.rcpt .ri{display:flex;align-items:center;gap:8px}
.rcpt .rt{width:28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none}
.rcpt .rt img{width:22px;height:22px;display:block}
.rcpt .li b{font-weight:700}
.rcpt .li.me{padding:11px 16px;background:#fbfefc}
.rcpt .li.me span{color:var(--ink);font-size:15px;font-weight:800}
.rcpt .li.me b{font-size:18px;font-weight:800;color:var(--g)}
.sheet .go{width:100%;height:52px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;transition:transform .15s}
.sheet .go:active{transform:scale(.96)}
.sheet .go:focus{outline:none}.sheet .go:focus-visible{box-shadow:0 0 0 4px var(--g3)}
.cf{position:absolute;width:6px;height:9px;border-radius:2px;z-index:25;pointer-events:none}
.cf.w{box-shadow:0 0 0 1px #c9ebd8}

/* bundle cards */
.fc{padding:14px;margin-bottom:10px;cursor:pointer;user-select:none}
.fc:active{transform:scale(.98)}
.fc .ft{display:flex;gap:12px;align-items:center}
.fc .fn{flex:1;min-width:0}
.fc .fn b{font-size:15px;font-weight:800;display:block}
.fc .fn span{font-size:12px;color:var(--sub);font-weight:600}
.fc .pg{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 7px}
.fc .pv{display:flex;align-items:baseline;font-size:24px;font-weight:800;color:var(--g)}
.fc .pv .gl{color:#9aa097;font-size:17px;font-weight:700;white-space:pre}
.fc .pg small{font-size:clamp(12.5px,calc(11.5px / var(--ps)),14px);color:#868b83;font-weight:600}
.fc .bar{height:10px;flex:1;min-width:0}
.fc .bw{display:flex;align-items:center;gap:10px}
.fc .arw{flex:none;width:18px;height:18px;margin-right:-4px;color:#a3a8a0;transition:transform .25s var(--out),color .25s}
.fc .arw svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fc:hover .arw{color:var(--g);transform:translateX(2px)}

/* ===== admin ===== */
.admin{height:100vh;overflow:hidden;background:#fbfbf9;min-width:0}
.admin.scroll{overflow:auto}
.admin.scroll .main{min-width:1000px;min-height:900px}
.main{zoom:var(--az);height:calc(100vh / var(--az));max-width:1500px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;padding:16px 20px;overflow:hidden}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--g);background:var(--g2);padding:7px 12px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 1.4s infinite}

.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:center;padding:12px 22px}
.st{display:flex;flex-direction:column;gap:3px;padding:0 20px;border-left:1px solid var(--line);min-width:0}
.st:first-child{padding-left:0;border-left:0}
.st .lb{font-size:14px;font-weight:800;color:var(--sub);white-space:nowrap}
.st .num{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.st .num .roll{font-size:42px;font-weight:800;letter-spacing:-1.4px}
.st .num small{font-size:18px;color:var(--sub);font-weight:700}
.big .live{margin-left:16px}

.body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(450px,1fr);gap:14px;min-height:0}
.lcol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;min-height:0}
.mapc{padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch h3{font-size:17px;font-weight:800}
.map-heading{display:flex;align-items:center;gap:10px}
.map-all{font-size:12px;font-weight:800;color:var(--g);background:var(--g2);padding:4px 8px;border-radius:7px;white-space:nowrap}
.lg{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--sub);font-weight:700}
.lg .k{display:inline-flex;align-items:center;gap:6px}
.lg .k i{width:12px;height:12px;border-radius:50%;background:#5cb985}
.lg .k i.c{background:#fff;border:2px solid #9fcfb4}
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip;border-radius:12px;container-type:size;background:#f7f8f5}
/* Animate the map and use its current scale to keep the markers the same size. */
@property --map-scale{syntax:"<number>";inherits:true;initial-value:1}
@property --map-x{syntax:"<percentage>";inherits:false;initial-value:0%}
@property --map-y{syntax:"<percentage>";inherits:false;initial-value:0%}
@property --pin-boost{syntax:"<number>";inherits:false;initial-value:1}
.mapwrap{position:absolute;inset:0;isolation:isolate;--mark-scale:calc(1 / var(--map-scale));transform-origin:0 0;transform:translate(var(--map-x),var(--map-y)) scale(var(--map-scale));transition:--map-x 550ms var(--ease),--map-y 550ms var(--ease),--map-scale 550ms var(--ease)}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mapwrap path{fill:#e9ede6;stroke:#fff;stroke-width:2}
.mapwrap path.op{fill:#5cb985;cursor:pointer}
.mapwrap path.selected{fill:var(--g3)}
.mapwrap path.op.selected{fill:color-mix(in srgb,var(--g),#5cb985)}
.mapwrap path.map-outline{fill:none;stroke:var(--g);stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.cand{position:absolute;z-index:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%) scale(var(--mark-scale));transition:opacity .2s ease-out}
.cand::before{content:"";box-sizing:border-box;width:clamp(16px,2.6cqw,22px);aspect-ratio:1;border-radius:50%;border:3px solid #7fc39d;background:#fff}
.cand:hover::before,.cand:focus-visible::before,.cand[aria-pressed="true"]::before{border-color:var(--g)}
.mapwrap.focused .cand:not([aria-pressed="true"]):not(:hover):not(:focus-visible){opacity:.34}
.cand[aria-pressed="true"]{z-index:5}
.cand-label{position:absolute;left:50%;bottom:calc(50% + 14px);transform:translateX(-50%);white-space:nowrap;color:var(--g);background:#fff;border-radius:8px;box-shadow:0 0 0 1px var(--g3),0 2px 6px rgba(0,0,0,.14);padding:5px 9px;font-size:14px;font-weight:800;pointer-events:none}
.mdot{position:absolute;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--g);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translate(-50%,-50%) scale(var(--mark-scale));pointer-events:none}
.pin{position:absolute;z-index:3;transform-origin:50% 100%;transform:translate(-50%,-100%) scale(var(--mark-scale)) translateY(-12px) scale(var(--pin-boost));display:inline-flex;align-items:center;white-space:nowrap;font-size:clamp(16px,min(3cqw,3.6cqh),21px);font-weight:800;padding:4px 10px;border-radius:9px;background:#fff;color:var(--g);box-shadow:0 0 0 1.5px var(--g3),0 2px 6px rgba(0,0,0,.14);transition:background .6s var(--ease),color .6s var(--ease),--pin-boost .6s var(--ease)}
.pin[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--g),0 2px 6px rgba(0,0,0,.14)}
.pin .pl{color:var(--ink);white-space:pre;transition:color .6s cubic-bezier(.2,.8,.2,1)}
.pin.hot{background:var(--ink);color:#fff;--pin-boost:1.08}
.pin.hot .pl{color:#fff}
.rip{position:absolute;border-radius:50%;border:2.5px solid var(--g);transform:translate(-50%,-50%) scale(var(--mark-scale));animation:rip 1.3s ease-out forwards;pointer-events:none}
.pin:focus-visible,.cand:focus-visible,.map-all:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.tip{position:fixed;z-index:50;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:7px 10px;border-radius:9px;pointer-events:none;opacity:0;transform:translate(12px,12px);transition:opacity .12s}
.tip.on{opacity:1}
.tip span{color:#9ee6bd;margin-left:6px}

/* order record table */
.feedc{padding:14px 0 0;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.feedc .ch{padding:0 16px}
.fh,.fr{display:grid;grid-template-columns:minmax(0,1fr) 72px 118px 26px 64px;column-gap:6px;align-items:center}
.fh{padding:0 14px 8px 17px;font-size:13.5px;font-weight:800;color:#7d8279;border-bottom:1px solid var(--line)}
.fh>*,.fr>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh .c4,.fr .c4{text-align:center}
.fh .c5,.fr .c5{text-align:right}
.feed{flex:1;min-height:0;overflow:hidden;position:relative}
.fi{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease-in-out}
.fi.in{grid-template-rows:1fr}
.fi.cut{visibility:hidden}
.fi>div{overflow:hidden}
.fr{padding:calc(10px + var(--fx,0px)) 14px;border-left:3px solid transparent;border-bottom:1px solid #f1f2ee;font-size:13.5px;font-weight:600;color:var(--sub);opacity:0;transition:opacity .25s}
.fi.in .fr{opacity:1}
.fi.in.hl .fr{animation:hl2 1.8s ease-out}
.fr .c1{font-size:15px;font-weight:800;color:var(--ink)}
.fr .c3{font-size:14.5px;font-weight:800;color:var(--g);display:flex;align-items:center;gap:5px}
.fr .c3 img{width:22px;height:22px;flex:none;display:block;user-select:none}
.fr .c3 em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.fr .c4{font-weight:800;color:var(--ink)}
.fr .c5{font-size:14px;font-weight:700;color:#6d726b}
.fi.mine .fr{border-left:6px solid var(--g);background:#e4f5eb;padding:calc(14px + var(--fx,0px)) 14px calc(14px + var(--fx,0px)) 11px;color:#2f5c43}
.fi.mine .fr .c1{font-size:16px}
.fi.mine.in.hl .fr{animation:hlm 2.4s ease-out}
.feedc [hidden]{display:none}
.feed-title-in{display:inline-block;animation:store-in 240ms ease-out both}
.stores{flex:1;min-height:0;display:flex;flex-direction:column}
.store-list{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);max-height:calc(var(--store-count) * 76px);overflow:hidden}
.stores .fh,.stores .fr{grid-template-columns:minmax(0,1fr) minmax(80px,24%) minmax(64px,19%);text-align:right}
.stores .fh>:first-child,.stores .fr>:first-child{text-align:left}
.stores .fr{padding:0 14px;animation:store-in 240ms ease-out both;animation-delay:calc(var(--i) * 30ms)}
.stores .fr.mine{border-left-color:var(--g);background:var(--g2)}
.stores .fr.mine .c1,.store-qty{color:var(--g)}
.store-status{justify-self:end;background:var(--g2);color:var(--g);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:800}

/* bundle status */
.lc{padding:12px 18px 10px}
.lc .ch{margin-bottom:8px}
.bars{display:grid;grid-template-columns:26px max-content max-content minmax(0,1fr) 78px 70px;column-gap:12px;row-gap:4px}
.fd{display:grid;grid-column:1/-1;grid-template-columns:subgrid;align-items:center;height:30px;padding:0 6px;font-size:15px;font-weight:700}
.fd img{width:26px;height:26px;display:block;user-select:none}
.fd .nm{white-space:nowrap}
.fd .fm{white-space:nowrap;font-size:13px;color:var(--sub);font-weight:600}
.fd .bt{height:12px;border-radius:6px;background:#f0f1ed;overflow:hidden}
.fd .bt i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#8fd6af,#16a05c);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.fd .vv{justify-self:end;font-size:15px;color:var(--g);font-weight:800}
.fd .ok{justify-self:end;display:none;font-size:13px;font-weight:800;color:#fff;background:var(--g);padding:3px 9px;border-radius:7px;white-space:nowrap}
.fd.full .ok{display:inline-block;animation:ddin .18s ease-out}

/* ===== admin calm ===== */
.admin{--ease:cubic-bezier(.2,.8,.2,1)}
.admin .card{animation-duration:.4s}
.admin .card:hover{transform:none;box-shadow:none}
.admin .rc{transition-duration:.45s}
.admin .mapwrap path{transition:fill .4s ease,stroke .15s}
.admin .mapwrap:not(.focused) path[data-g]:hover{stroke:var(--ink)}
.admin .mapwrap path.op:focus-visible{outline:none;stroke:var(--g);stroke-width:3}
@media (prefers-reduced-motion:reduce){
  .mapwrap{transition:none}
  .stores .fr,.feed-title-in{animation:none;opacity:1}
}

  y0=Math.min(y0,ME.y-T);

  S.storeOrders.set(store,stats);
}
function pushOrder(o){const bb=BOF(o.item);if(bb.cur>=bb.goal)return;o.qty=Math.min(o.qty,bb.goal-bb.cur);ITEMS.forEach(i=>{const x=BOF(i.id),r=Math.max(0,x.goal-x.cur-(i.id===o.item?o.qty:0));if(S.qty[i.id]>r)S.qty[i.id]=r});setArea(null);applyOrder(o.store,o.item,o.qty);renderAdmin();ripple();hotPin();addFeed(o);renderFarms();renderFund();renderMini()}
let BT=[],burstDone=false;
/* G is ignored from the moment a hold starts (pressing, confirming, sheet open) */
function runBurst(){if(BT.length||burstDone||gLock||sheetOpen||hp!==null||ht)return;burstDone=true;BURST.forEach(([st,it,q],i)=>BT.push(setTimeout(()=>pushOrder({store:st,item:it,qty:q,t:Date.now()}),i*260)));BT.push(setTimeout(()=>BT=[],(BURST.length-1)*260+50))}
function stopBurst(){BT.forEach(clearTimeout);BT=[]}

function clock(){const d=new Date(),p=n=>String(n).padStart(2,'0');$('#ptime').textContent=`${d.getHours()}:${p(d.getMinutes())}`;ftime()}
setInterval(clock,1000);clock();

/* fit: phone scale by height, admin zoom by available size */
let AZ=1;
function fit(){
  const W=innerWidth,H=innerHeight,ps=Math.min((H-36)/790,Math.max(1,W/1670)),cw=Math.round(430*ps);
  const raw=Math.min(1.6,(W-cw)/1000,H/900);AZ=Math.max(.6,raw);$('.admin').classList.toggle('scroll',raw<.6);
  const r=document.documentElement.style;r.setProperty('--ps',ps.toFixed(4));r.setProperty('--colw',cw+'px');r.setProperty('--az',AZ.toFixed(4));
}
fit();
let togT=null,togTok=0;
const togPhone=()=>{
  const h=$('.app').classList.toggle('hide'),tok=++togTok,st=$('.stage'),ph=$('.phone');clearTimeout(togT);
  if(h){cancelHold();st.inert=true}
  else{
    let ft=null;
    const done=()=>{ph.removeEventListener('transitionend',te);clearTimeout(ft);if(tok!==togTok||$('.app').classList.contains('hide'))return;st.inert=false;if(sheetOpen)$('#sheetGo').focus({preventScroll:true})};
    const te=e=>{if(e.target===ph&&e.propertyName==='transform')done()};
    ph.addEventListener('transitionend',te);ft=setTimeout(done,800);
  }
  togT=setTimeout(()=>window.dispatchEvent(new Event('resize')),700);
};
$('#tog').onclick=togPhone;

/* reset (R) */
function resetDemo(){
  TM.forEach(clearTimeout);TM=[];stopBurst();burstDone=false;cancelHold();clearTimeout(S.cfT);clearTimeout(S.hotT);clearTimeout(togT);
  RAF.forEach(cancelAnimationFrame);RAF.clear();
  setArea(null);
  busy=false;sheetOpen=false;gLock=false;pinned=null;S.done={};tip.classList.remove('on');
  hold.classList.remove('loading','done','pressing','shake');
  $('#scrim').classList.remove('show');$('#sheet').classList.remove('show');$('#scrim').inert=true;$('#sheet').inert=true;behind(false);
  $('#sheetT').textContent='';$('#rcpt').innerHTML='';
  $$('.cf,.rip').forEach(e=>e.remove());$$('.row.flash',ol).forEach(r=>r.classList.remove('flash'));
  pin.classList.remove('hot');
  initData();renderOrder();seedFeed();
  if($('.app').classList.contains('hide'))togPhone();
  if(tab!==0)go(0);else renderFarms();
  ol.scrollTop=0;$('#p2').scrollTop=0;$('.panes').scrollLeft=0;
  renderAdmin();renderFund();
}
document.addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='INPUT')return;
  if(e.code==='KeyH')togPhone();
  else if(e.code==='KeyG')runBurst();
  else if(e.code==='KeyR')resetDemo();
});
/* boot */
seedFeed();
renderOrder();placeTab();
renderMap();fitMap();
new ResizeObserver(fitMap).observe(mapbox);
setTimeout(()=>{document.body.classList.remove('loading');renderAdmin();renderFarms();renderFund();fitFeed()},950);
if(document.fonts)document.fonts.ready.then(()=>{fit();placeTab();fitFeed()});
let rzF=0;window.addEventListener('resize',()=>{cancelAnimationFrame(rzF);rzF=requestAnimationFrame(()=>{fit();placeTab();fitFeed()})});
</script>
</body>
</html>
