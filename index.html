<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소쿠리 공동발주 시연</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<style>
:root{--bg:#f6f4ee;--card:#fff;--line:#e8e4d8;--ink:#1b211c;--sub:#666b60;--mute:#9a9e92;--soil:#8a5a2b;--soil2:#e9dcc6;--g:#0f9547;--deep:#0a5c2c;--yellow:#ffd43a;--mine:#fff59a;--g2:#e3f6e9;--g3:#c5ebd0;--r:14px;--spring:cubic-bezier(.3,1.35,.5,1);--out:cubic-bezier(.2,.9,.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root{--colw:430px;--ps:1;--az:1}
.app{display:grid;grid-template-columns:var(--colw) 1fr;height:100vh;transition:grid-template-columns .65s cubic-bezier(.65,0,.2,1)}
.app.hide{grid-template-columns:0px 1fr}
.stage{min-width:0;overflow:hidden;position:relative}
.phone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--ps));transition:transform .65s cubic-bezier(.65,0,.2,1),opacity .5s}
.app.hide .phone{transform:translate(-50%,-50%) translateX(-110%) scale(calc(var(--ps) * .92));opacity:0}
.tog{position:fixed;top:50%;left:var(--colw);z-index:60;width:26px;height:64px;margin-top:-32px;border-radius:0 14px 14px 0;background:#fff;border:1px solid var(--line);border-left:0;box-shadow:4px 0 14px -8px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--sub);transition:left .65s cubic-bezier(.65,0,.2,1),color .2s,width .25s var(--spring)}
.tog:hover{color:var(--g);width:32px}
.tog svg{width:18px;height:18px;transition:transform .5s var(--spring)}
.app.hide~.tog svg{transform:rotate(180deg)}
.app.hide~.tog{left:0}

/* roll */
.roll{display:inline-flex;white-space:nowrap}
.rd{display:inline-block;height:1.1em;overflow:hidden;line-height:1.1em}
.rc{display:flex;flex-direction:column;transition:transform .9s var(--out)}
.rc span{height:1.1em;line-height:1.1em;text-align:center}
.rs{line-height:1.1em;white-space:pre}

/* keyframes */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}
@keyframes rip{from{width:10px;height:10px;opacity:1}to{width:90px;height:90px;opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,149,71,.55)}100%{box-shadow:0 0 0 9px rgba(15,149,71,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hl2{from{background:#e3f6e9}}
@keyframes hlm{0%,24%{background:var(--yellow)}100%{background:var(--mine)}}
@keyframes rowfl{from{background:#dff4e6;border-color:var(--g)}}
@keyframes ddin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes store-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* card + skeleton */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:relative;transition:transform .3s var(--out),box-shadow .3s;animation:up .6s var(--out) both;animation-delay:var(--d,0ms)}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(20,27,48,.28)}
.card>*{transition:opacity .5s}
body.loading .card>*{opacity:0}
body.loading .card::after{content:"";position:absolute;inset:14px;border-radius:10px;background:linear-gradient(90deg,#eeebe3 25%,#fbfaf6 50%,#eeebe3 75%);background-size:200% 100%;animation:shim 1.1s linear infinite}

/* progress bar */
.bar{height:8px;border-radius:99px;background:#efede6;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#2fae5e,#0f9547);transition:width 1.2s var(--out);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sheen 2.4s ease-in-out infinite}

.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--g2);color:var(--g)}
.av{width:34px;height:34px;border-radius:11px;background:var(--g2);display:grid;place-items:center;flex:none}
.av img{width:26px;height:26px;display:block;user-select:none}

/* ===== phone ===== */
.stage{display:grid;place-items:center;background:radial-gradient(circle at 30% 15%,#fffdf6 0,#ece6d6 75%);border-right:1px solid var(--line)}
.phone{width:372px;height:790px;border-radius:54px;background:#12141c;padding:10px;box-shadow:0 40px 70px -30px rgba(20,26,48,.45),inset 0 0 0 2px #2c303e}
.screen{position:relative;height:100%;border-radius:44px;background:#f6f4ee;overflow:hidden;display:flex;flex-direction:column}
.sbar{height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0;font-size:14px;font-weight:700}
.sic{display:flex;align-items:center;gap:6px}
.sic svg{display:block;fill:var(--ink)}
.phead{display:flex;align-items:center;gap:8px;padding:4px 20px 12px}
.phead h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.phead .papp{margin-left:auto;width:32px;height:32px;display:block;user-select:none}
.phead .av{width:38px;height:38px;border-radius:12px}
.phead .av img{width:28px;height:28px}
.panes{flex:1;min-height:0;overflow:hidden;overflow:clip;position:relative}
.track{display:flex;width:200%;height:100%;transition:transform .6s cubic-bezier(.65,0,.2,1)}
.pane{width:50%;height:100%;overflow-y:auto;padding:2px 16px 18px;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.pane.show .stag{animation:up .55s var(--out) both;animation-delay:calc(var(--i,0)*70ms)}
.tabbar{height:78px;display:flex;position:relative;border-top:1px solid var(--line);background:#fff;padding:8px 14px 22px}
.tabbar .pill{position:absolute;top:8px;height:48px;border-radius:16px;background:var(--g2);transition:left .5s var(--spring),width .5s var(--spring)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;color:var(--mute);transition:color .3s,transform .15s}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--g)}
.tab svg.i{width:23px;height:23px}

.tile{width:44px;height:44px;border-radius:13px;background:#f2efe7;display:grid;place-items:center;flex:none;transition:transform .4s var(--spring),background .3s}
.tile img{width:34px;height:34px;display:block;user-select:none;pointer-events:none}
.dd{font-size:11px;font-weight:800;color:#6a6f63;background:#eeebe3;padding:3px 7px;border-radius:7px;white-space:nowrap}
.dd.ok{color:#fff;background:var(--g);animation:ddin .18s ease-out}
.dds{display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:flex-start}

/* order */
.pane.order{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
.olist{flex:1;overflow-y:auto;margin:12px -16px 0;padding:0 16px 10px;scrollbar-width:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 12px 12px;margin-bottom:8px;transition:border-color .3s,background .3s,transform .3s var(--out),box-shadow .3s}
.row.has{border-color:var(--g3);background:#f6fcf8}
.row.has .tile{background:var(--g2);transform:rotate(-6deg) scale(1.05)}
.row .inf{flex:1;min-width:0}
.row .nm{font-size:17px;font-weight:700;white-space:nowrap}
.row .pr{white-space:nowrap;font-size:14px;margin-top:3px;letter-spacing:-.2px}
.row .pr b{font-weight:800}
.row .sp{font-size:12px;color:var(--sub);font-weight:600;margin-top:3px;white-space:nowrap}
.row .mp{flex-basis:100%;display:flex;align-items:center;gap:8px;margin-top:2px}
.row .mp .dd{flex:none}
.mb{flex:1;min-width:0;height:8px;border-radius:99px;background:#efede6;overflow:hidden;display:flex}
.mb i{display:block;height:100%;width:0;flex:none;transition:width .45s var(--out)}
.mb .b0{background:#9fdcb3}
.mb .b1{background:var(--g)}
.mt{flex:none;font-size:13px;font-weight:800;color:#666b60;white-space:nowrap}
.mt b{color:var(--g);font-weight:800}
.gathered{flex-basis:100%;margin-top:-4px;color:var(--sub);font-size:11.5px;font-weight:700}
.step{display:flex;align-items:center;background:#efede6;border-radius:12px;padding:3px}
.step button{width:28px;height:30px;border-radius:9px;font-size:18px;font-weight:700;display:grid;place-items:center;transition:background .2s,transform .15s var(--spring)}
.step button:hover{background:#fff}
.step button:active{transform:scale(.8)}
.step .q{width:52px;text-align:center;font-weight:800;font-size:15px;display:flex;justify-content:center}
.step .q .rs{font-size:11.5px;color:var(--sub);align-self:flex-end;padding-bottom:1px}
.row.flash{animation:rowfl 1.6s ease-out .3s both}
.sum{border-top:1px solid var(--line);background:#fff;margin:0 -16px;padding:12px 18px 14px}
.sum .sl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:4px}
.sum .sl .roll{font-size:18px;font-weight:800;color:var(--ink)}
.hold{position:relative;display:block;margin:10px auto 0;width:100%;height:54px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;overflow:hidden;transition:width .5s cubic-bezier(.6,0,.2,1),border-radius .5s,transform .2s var(--spring),opacity .3s,background .3s;touch-action:none;user-select:none}
.hold .fill{position:absolute;inset:0;background:var(--g);transform-origin:left;transform:scaleX(0);transition:transform .35s ease-out}
.hold.pressing{transform:scale(.97)}
.hold.pressing .fill{transform:scaleX(1);transition:transform 1.1s linear}
.hold .lbl{position:relative;transition:opacity .2s}
.hold.off{opacity:.35}
.hold.shake{animation:shake .45s}
.hold.loading,.hold.done{width:54px;border-radius:27px;background:var(--g)}
.hold.loading .lbl,.hold.done .lbl{opacity:0}
.hold .spn{position:absolute;inset:15px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;opacity:0}
.hold.loading .spn{opacity:1;animation:spin .7s linear infinite}
.hold .ok{position:absolute;inset:0;margin:auto;width:26px;height:26px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.hold.done .ok{animation:draw .3s var(--out) forwards}

.scrim{position:absolute;inset:0;background:rgba(12,16,38,.38);opacity:0;pointer-events:none;transition:opacity .4s;z-index:19;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:26px 22px 28px;max-height:100%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .65s cubic-bezier(.2,1.15,.3,1);z-index:20;text-align:center}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#e3dfd4;margin:-12px auto 18px}
.ck{width:68px;height:68px;border-radius:50%;background:var(--g);margin:0 auto 14px;display:grid;place-items:center;transform:scale(0)}
.sheet.show .ck{animation:pop .5s var(--spring) .1s forwards}
.ck svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.sheet.show .ck svg{animation:draw .4s var(--out) .4s forwards}
.sheet h3{font-size:22px;font-weight:800}
.sheet .grab,.sheet .ck,.sheet h3,.sheet .go{flex:none}
.sheet.pending .ck{display:none}
.rcpt{margin:15px 0;text-align:left;border:1px solid var(--line);border-radius:16px;overflow:auto;min-height:0;overscroll-behavior:contain}
.receipt+.receipt{border-top:1px solid var(--line)}
.rcpt .top{background:var(--g2);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rcpt .ri{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800}
.rcpt .rt{width:27px;height:27px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none}
.rcpt .rt img{width:22px;height:22px;display:block}
.rcpt .tv{font-size:26px;font-weight:800;color:var(--g);letter-spacing:-.5px;white-space:nowrap}
.rcpt .met{padding:8px 14px;color:var(--deep);font-size:13px;font-weight:800;background:var(--g2)}
.rcpt .li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 14px;font-size:14px;font-weight:650;border-top:1px solid var(--line)}
.sheet.show .rcpt .li{animation:up .4s var(--out) both;animation-delay:calc(.35s + var(--i)*48ms)}
.rcpt .li b,.rcpt .li small{white-space:nowrap}
.rcpt .li.me{color:var(--deep);background:var(--mine);font-weight:800}
.rcpt .li small{margin-left:4px;font-size:11px}
.rcpt .compact .li,.rcpt.multi .li{padding-block:4px;font-size:12px}
.rcpt .receipt-totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.rcpt .receipt-totals div{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:10px 12px;font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
.rcpt .receipt-totals div+div{border-left:1px solid var(--line)}
.rcpt .receipt-totals b{font-size:15px;color:var(--deep)}
.rcpt .delivery{padding:7px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);font-weight:700}
.sheet .go{width:100%;height:52px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;transition:transform .15s}
.sheet .go:active{transform:scale(.96)}
.sheet .go:focus{outline:none}.sheet .go:focus-visible{box-shadow:0 0 0 4px var(--g3)}
.cf{position:absolute;width:6px;height:9px;border-radius:2px;z-index:25;pointer-events:none}
.cf.w{box-shadow:0 0 0 1px #c5ebd0}

/* bundle cards */
.fc{padding:14px;margin-bottom:10px;cursor:pointer;user-select:none;overflow:hidden}
.fc:active{transform:scale(.98)}
.fc .ft{display:flex;gap:12px;align-items:center}
.fband{position:relative;height:40px;margin:-14px -14px 12px;border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;overflow:hidden;display:flex;align-items:center;padding:0 14px;background:linear-gradient(115deg,var(--b1),var(--b2))}
.fband::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-14deg,transparent 0 10px,rgba(255,255,255,.16) 10px 12px)}
.fband img{position:absolute;right:16px;top:4px;width:50px;height:50px;transform:rotate(-14deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));pointer-events:none}
.freg{position:relative;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.freg svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2}
.fc .ft .tile{display:none}
.fb-ch{--b1:#7cb86a;--b2:#2f7d3e}
.fb-on{--b1:#e0b25e;--b2:#b07a33}
.fb-mu{--b1:#b8987a;--b2:#7a5b40}
.fc .fn{flex:1;min-width:0}
.fc .fn b{font-size:15px;font-weight:800;display:block}
.fc .fn span{font-size:12px;color:var(--sub);font-weight:600}
.fc .pg{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 7px}
.fc .pv{display:flex;align-items:baseline;font-size:24px;font-weight:800;color:var(--g)}
.fc .pv .gl{color:#7a7f72;font-size:17px;font-weight:700;white-space:pre}
.fc .pg small{font-size:clamp(12.5px,calc(11.5px / var(--ps)),14px);color:#666b60;font-weight:600}
.fc .bar{height:10px;flex:1;min-width:0}
.fc .bw{display:flex;align-items:center;gap:10px}
.fc .arw{flex:none;width:18px;height:18px;margin-right:-4px;color:#9a9e92;transition:transform .25s var(--out),color .25s}
.fc .arw svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fc:hover .arw{color:var(--g);transform:translateX(2px)}

/* ===== admin ===== */
.admin{height:100vh;overflow:hidden;background:#f6f4ee;min-width:0}
.admin.scroll{overflow:auto}
.admin.scroll .main{min-width:1000px;min-height:900px}
.main{zoom:var(--az);height:calc(100vh / var(--az));max-width:1500px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;padding:16px 20px;overflow:hidden}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--g);background:var(--g2);padding:7px 12px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 1.4s infinite}

.big{display:flex;align-items:center;padding:9px 18px}
.st{display:flex;align-items:baseline;gap:8px;padding:0 18px;border-left:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;margin-right:20px}
.brand img{width:36px;height:36px;display:block;user-select:none}
.wordmark{font-size:20px;font-weight:900;color:var(--deep);letter-spacing:-.6px;white-space:nowrap}
.st .lb{font-size:13px;font-weight:800;color:var(--sub);white-space:nowrap}
.st .num{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.st .num .roll{font-size:24px;font-weight:800;letter-spacing:-.6px}
.st .num small{font-size:14px;color:var(--sub);font-weight:700}
.big .live{margin-left:auto}

.body{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(450px,1fr);gap:14px;min-height:0}
.rcol{display:grid;grid-template-rows:minmax(0,50fr) minmax(0,50fr);gap:14px;min-width:0;min-height:0}
.lcol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;min-height:0}
.mapc{padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch h3{font-size:17px;font-weight:800}
.map-heading{display:flex;align-items:center;gap:10px}
.map-all{font-size:12px;font-weight:800;color:var(--g);background:var(--g2);padding:4px 8px;border-radius:7px;white-space:nowrap}
.lg{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--sub);font-weight:700}
.lg .k{display:inline-flex;align-items:center;gap:6px}
.lg .k i{width:12px;height:12px;border-radius:50%;background:var(--g)}
.lg .k i.c{background:#fff;border:2px solid #6fcb8e}
.lg .k i.r{width:18px;height:0;border-radius:0;background:none;border-top:2.5px dashed var(--soil);opacity:.7}
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip;border-radius:12px;background:#eef0e4}
@property --map-scale{syntax:"<number>";inherits:true;initial-value:1}
@property --map-x{syntax:"<percentage>";inherits:false;initial-value:0%}
@property --map-y{syntax:"<percentage>";inherits:false;initial-value:0%}
.mapwrap{position:absolute;inset:0;isolation:isolate;--mark-scale:calc(1 / var(--map-scale));transform-origin:0 0;transform:translate(var(--map-x),var(--map-y)) scale(var(--map-scale));transition:--map-x 550ms var(--ease),--map-y 550ms var(--ease),--map-scale 550ms var(--ease)}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mapwrap path{fill:#e6e6d8;stroke:#fbfaf4;stroke-width:1.2;transition:fill .4s var(--ease)}
.mapwrap path.op{fill:url(#opf);stroke:#5fbf80;stroke-width:1}
.mapwrap path.dots{fill:url(#dots);stroke:none;pointer-events:none}
.mapwrap .route{fill:none;stroke:var(--soil);stroke-linecap:round;opacity:.55}
.mapwrap .route.go{stroke:var(--g);opacity:1}
.mapwrap .route.full:not(.go){stroke:var(--g);opacity:.85;stroke-dasharray:none}
.mapwrap.farmsel .route:not(.sel){opacity:.18}
.mapwrap.farmsel .route.sel{stroke:var(--g);opacity:1}

.farm-tag{position:absolute;z-index:2;transform:translate(-50%,-50%) scale(var(--mark-scale));display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:99px;background:#fffdf7;box-shadow:0 0 0 1px var(--soil2),0 3px 8px -4px rgba(90,60,20,.35);font-size:13px;font-weight:800;color:var(--soil);white-space:nowrap;cursor:pointer;font-family:inherit;transition:box-shadow .3s,color .3s,background .3s}
.farm-tag img{width:24px;height:24px;border-radius:50%;background:#f4ecdc;padding:2px;display:block}

.pin::before{content:"";width:15px;height:15px;border-radius:50%;background:var(--g);border:2px solid #fff;box-shadow:0 0 0 1px var(--g)}

.pin:hover::before,.pin[aria-pressed="true"]::before{box-shadow:0 0 0 3px #9fdcb3}
.pin-label{position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:3px;white-space:nowrap;color:var(--deep);background:#fff;border-radius:8px;box-shadow:0 0 0 1px var(--g3),0 2px 6px rgba(0,0,0,.13);padding:6px 9px;font-size:14px;font-weight:800;transition:background .24s var(--ease),color .24s var(--ease)}
.pin.gate .pin-label{left:calc(100% + 3px);bottom:50%;transform:translateY(50%);font-size:16px}
.pin.market .pin-label{left:auto;right:calc(100% + 3px);bottom:50%;transform:translateY(50%)}

.pin[aria-pressed="true"] .roll,.pin.hot .roll{color:#fff}
.rip{position:absolute;border-radius:50%;border:2.5px solid var(--g);transform:translate(-50%,-50%) scale(var(--mark-scale));animation:rip 1.3s ease-out forwards;pointer-events:none}

/* purchase data */
.purchase{min-height:0;min-width:0;display:flex;flex-direction:column;padding:14px 16px;overflow:hidden}
.purchase .ch{margin-bottom:11px;min-height:24px}
.purchase .ch h3{white-space:nowrap}
.purchase-status{font-size:12px;padding:3px 8px;border-radius:7px;background:#efede6;color:var(--sub);font-weight:800;white-space:nowrap}
.purchase-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);gap:10px}
.metric{min-width:0;min-height:0;border-radius:10px;background:#faf8f3;border:1px solid #efede6;padding:10px;display:flex;flex-direction:column;gap:6px}
.metric h4{font-size:13px;font-weight:800;color:var(--sub);white-space:nowrap}
.rank-list{flex:1;min-height:0;position:relative}
.rank-row{position:absolute;left:0;right:0;top:0;height:calc(100% / 3);display:grid;grid-template-columns:22px max-content minmax(0,1fr) 40px;gap:5px;align-items:center;transform:translateY(calc(var(--rank) * 100%));transition:transform 300ms var(--ease);font-size:13px;font-weight:750}
.rank-row img{width:22px;height:22px}
.rank-row b{text-align:right;color:var(--deep)}
.rank-track{height:8px;border-radius:10px;background:#dff4e6;overflow:hidden}
.rank-track i{display:block;width:var(--value,0%);height:100%;border-radius:inherit;background:#2fae5e;transition:width 420ms var(--ease),background-color 180ms var(--ease)}
.columns{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.column{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 16px;text-align:center}
.column-plot{min-height:0;display:flex;align-items:flex-end;justify-content:center;padding-top:15px}
.column i{display:block;position:relative;width:min(75%,30px);height:var(--value,0%);min-height:3px;border-radius:4px 4px 1px 1px;background:#2fae5e;transition:height 420ms var(--ease),background-color 180ms var(--ease)}
.column b{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);font-style:normal;color:var(--deep);font-size:12px;white-space:nowrap}
.column small{color:var(--sub);font-size:12px;font-weight:750;padding-top:2px}
.column.zero i{background:#e2ded3}
.trend{gap:3px}
.trend .column{grid-template-rows:minmax(0,1fr)}
.trend .column i{width:100%;background:#c5ebd0}
.trend .column.current i{background:var(--g)}
.metric.wide{grid-column:1/-1}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price-line{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;color:var(--deep);letter-spacing:-.2px}
.price-line .chip{font-size:12px;padding:3px 8px;background:var(--mine);color:var(--deep)}

.feedc .ch{padding:0 16px;min-height:24px;margin-bottom:6px;gap:8px}

.store-status{justify-self:end;background:var(--g2);color:var(--g);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:800}

/* hold to confirm */
const hold=$('#hold');let ht=null,hp=null,busy=false,sheetOpen=false,pinned=null;
const shake=()=>{hold.classList.remove('shake');void hold.offsetWidth;hold.classList.add('shake')};
function startHold(id){
  if(busy||ht)return;
  /* while G orders are still arriving the owner's order cannot be confirmed */
  if(!S._p){shake();return}
  hp=id;hold.classList.add('pressing');ht=setTimeout(confirmOrder,1100);
}
function cancelHold(){if(ht){clearTimeout(ht);ht=null}hp=null;hold.classList.remove('pressing')}
hold.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||hp!==null)return;startHold(e.pointerId);if(hp===e.pointerId)try{hold.setPointerCapture(e.pointerId)}catch(_){}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>hold.addEventListener(ev,e=>{if(e.pointerId===hp)cancelHold()}));
hold.addEventListener('keydown',e=>{if(e.key!==' '&&e.key!=='Enter')return;e.preventDefault();if(e.repeat||hp!==null)return;startHold('key')});
hold.addEventListener('keyup',e=>{if((e.key===' '||e.key==='Enter')&&hp==='key')cancelHold()});
hold.addEventListener('blur',()=>{if(hp==='key')cancelHold()});
window.addEventListener('blur',cancelHold);
function confirmOrder(){
  ht=null;hp=null;if(busy)return;
  const lines=ITEMS.filter(i=>S.qty[i.id]>0).map(i=>({id:i.id,q:S.qty[i.id]}));
  if(!lines.length){hold.classList.remove('pressing','shake');renderOrder();shake();return}
  busy=true;
  hold.classList.remove('pressing');hold.classList.add('loading');
  setArea(null);
  // phone cards, admin rows and the record table update at the moment of hold completion
  lines.forEach(l=>applyOrder(ME.store,l.id,l.q));
  S.done=Object.fromEntries(lines.map(l=>[l.id,l.q]));renderMini();
  renderAdmin();renderFarms();renderFund();ripple();hotPin();flowRoutes(lines.map(l=>l.id));
  /* the owner's rows stay on top of the record table until R */
  let low=null;lines.slice().reverse().forEach(l=>{const li=addFeed({store:ME.store,item:l.id,qty:l.q,mine:true,t:Date.now()});if(!low)low=li});
  if(!pinned||pinned.parentNode!==feed)pinned=low;
  later(()=>{hold.classList.remove('loading');hold.classList.add('done')},220);
  later(()=>{
    renderReceipt(lines);
    sheetOpen=true;$('#scrim').inert=false;$('#sheet').inert=false;behind(true);
    $('#scrim').classList.add('show');$('#sheet').classList.add('show');
    if(!$('.stage').inert)$('#sheetGo').focus({preventScroll:true});
    if(!$('#sheet').classList.contains('pending'))S.cfT=later(confetti,250);
  },600);
}
function renderReceipt(lines){
  const orders=lines.map(({id,q})=>{
    const bundle=BOF(id);
    return {id,q,bundle,full:bundle.cur>=bundle.goal};
  });
  const full=orders.every(o=>o.full),receipt=$('#rcpt');
  $('#sheetT').textContent=full?'공동발주 확정':'주문 접수';
  $('#sheet').classList.toggle('pending',!full);
  receipt.classList.toggle('multi',orders.length>1);
  receipt.innerHTML=orders.map(({id,q,bundle,full})=>{
    const {cur,goal,day,stores}=bundle;
    const participants=[...stores].filter(([name])=>name!==ME.store);
    participants.push([ME.store,stores.get(ME.store)]);
    const meals=full?participants.map(([name,qty],index)=>{
      const mine=name===ME.store;
      return `<div class="li${mine?' me':''}" style="--i:${index}"><span>${name}${mine?' <small>(방금)</small>':''}</span><b>${qty}kg</b></div>`;
    }).join(''):'';
    return `<section class="receipt${stores.size>5?' compact':''}">
      <div class="top"><span class="ri"><span class="rt">${pic(id)}</span>${IT[id].n}</span><b class="tv">${cur} / ${goal}kg</b></div>
      ${full?'<div class="met">✓ 최소 출하량 달성 · 발주 확정</div>':''}${meals}
      <div class="receipt-totals">${full?`<div>농가 출하 <b>${cur}kg</b></div>`:''}<div>내 수령 <b>${q}kg</b></div></div>
      <div class="delivery">납품 ${day}요일</div>
    </section>`;
  }).join('');
}

function confetti(){
  const sc=$('#screen'),w=sc.clientWidth,h=sc.clientHeight,cs=['#0f9547','#6fcb8e','#ffffff','#2fae5e','#ffd43a','#fff59a'];
  for(let i=0;i<22;i++){const c=document.createElement('i'),col=cs[i%cs.length];c.className='cf'+(col==='#ffffff'?' w':'');c.style.background=col;c.style.left=w/2+'px';c.style.top=(h*.5)+'px';sc.appendChild(c);
    const a=R()*Math.PI*2,v=70+R()*110,dx=Math.cos(a)*v,dy=Math.sin(a)*v-110;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${R()*400}deg)`,opacity:1,offset:.55},{transform:`translate(${dx*1.15}px,${dy+150}px) rotate(${R()*700}deg)`,opacity:0}],{duration:800+R()*200,easing:'cubic-bezier(.15,.7,.4,1)'}).onfinish=()=>c.remove()}

// The map uses one district boundary and three market buttons.
const map=$('#map'),mw=$('#mapwrap'),mapbox=$('#mapbox'),mapAll=$('#mapAll');
const AREAS=new Map([ME,...CANDS].map(area=>[area.id,area]));
let mapBounds,view,selectedArea=null,selectedFarm=null,pin;
const pins=new Map();
function placeMarker(el,{x,y}){
  el.style.left=`${(x-view.x)/view.w*100}%`;
  el.style.top=`${(y-view.y)/view.h*100}%`;
}
function renderMap(){
  const op=GEO.find(([d])=>d==='동대문구')[1];
  map.innerHTML=`<defs><linearGradient id="opf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7f0dd"/><stop offset="1" stop-color="#bfe6c9"/></linearGradient>
   <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".45" fill="#7fc795" opacity=".55"/></pattern></defs>`+
   GEO.map(([district,path])=>`<path d="${path}"${district==='동대문구'?' class="op"':''}/>`).join('')+
   `<path class="dots" d="${op}"/><g id="routes"></g><g id="shops"></g>`;
  mapBounds=$('.op',map).getBBox();
  GEO.forEach(([district],i)=>{if(district==='동대문구')return;const b=$$('path',map)[i].getBBox();
    const lab=document.createElement('span');lab.className='dlab';lab.textContent=district;lab._p={x:b.x+b.width/2,y:b.y+b.height/2};mw.appendChild(lab)});
  BUNDLES.forEach(b=>{const t=document.createElement('button');t.type='button';t.className='farm-tag';t.dataset.it=b.it;t.setAttribute('aria-pressed','false');t.setAttribute('aria-label',`${b.farm} 출하`);t.innerHTML=`${pic(b.it)}${FARM_REGION[b.it]}<b class="ship"></b>`;mw.appendChild(t)});
  for(const area of AREAS.values()){
    const [u,v]=area.point;
    area.x=mapBounds.x+mapBounds.width*u;area.y=mapBounds.y+mapBounds.height*v;
    const button=document.createElement('button');
    button.type='button';button.className=`pin ${area.id}${area===ME?'':' plan'}`;
    button.dataset.area=area.id;
    button.setAttribute('aria-label',`${area.area} · ${area===ME?'운영 중':'계획'}`);
    button.setAttribute('aria-pressed','false');
    button.innerHTML=`<span class="pin-label">${area.area}${area===ME?' <span class="roll" id="pinN"></span>kg':''}</span>`;
    mw.appendChild(button);
    pins.set(area.id,button);

function positionMap(){
  const scale=selectedArea?1.28:1;
  const x=selectedArea?50-(selectedArea.x-view.x)/view.w*100*scale:0;
  const y=selectedArea?50-(selectedArea.y-view.y)/view.h*100*scale:0;
  mw.style.setProperty('--map-x',x+'%');
  mw.style.setProperty('--map-y',y+'%');
  mw.style.setProperty('--map-scale',scale);
}
function fitMap(){
  const bw=mw.clientWidth,bh=mw.clientHeight;
  if(!bw||!bh||!mapBounds)return;
  const {x,y,width,height}=mapBounds,ratio=bw/bh;
  const w=Math.max(width+90,(height+60)*ratio),h=w/ratio;
  view={x:x+(width-w)/2,y:y+(height-h)/2,w,h};
  map.setAttribute('viewBox',`${view.x} ${view.y} ${w} ${h}`);
  const u=w/bw;
  $$('.shop',map).forEach(c=>{c.setAttribute('r',3.6*u);c.setAttribute('stroke-width',2*u)});
  $$('.dlab',mw).forEach(l=>{const {x:px,y:py}=l._p;const near=Object.values(FARM_AT).some(([fx,fy])=>Math.abs(view.x+w*fx-px)<70*u&&Math.abs(view.y+h*fy-py)<30*u);
    l.hidden=near||px<view.x+8*u||px>view.x+w-8*u||py<view.y+8*u||py>view.y+h-8*u;if(!l.hidden)placeMarker(l,l._p)});
  $('#routes').innerHTML=BUNDLES.map(b=>{const [fx,fy]=FARM_AT[b.it],ax=view.x+w*fx,ay=view.y+h*fy;
    const mx=(ax+ME.x)/2,my=(ay+ME.y)/2,dx=ME.x-ax,dy=ME.y-ay,k=FARM_BEND[b.it];
    return `<path class="route" data-it="${b.it}" d="M${ax},${ay} Q${mx-dy*k},${my+dx*k} ${ME.x},${ME.y}" stroke-width="${2.2*u}" stroke-dasharray="${2*u} ${6*u}"/>`}).join('');
  $$('.farm-tag',mw).forEach(t=>{const [fx,fy]=FARM_AT[t.dataset.it];placeMarker(t,{x:view.x+w*fx,y:view.y+h*fy})});
  markRoutes();
  pins.forEach((button,id)=>placeMarker(button,AREAS.get(id)));
  $$('.rip',mw).forEach(el=>placeMarker(el,ME));
  positionMap();
}
function clearFarm(){

}
function setFarm(id){
  if(selectedFarm===id){setArea(null);return}
  if(selectedArea){selectedArea=null;mw.classList.remove('focused');pins.forEach(b=>b.setAttribute('aria-pressed','false'));positionMap();renderPurchaseArea()}
  selectedFarm=id;mapAll.hidden=false;mw.classList.add('farmsel');
  $$('.farm-tag',mw).forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.it===id)));
  markRoutes();renderAreaPanel();

function setArea(area){
  if(selectedArea===area&&!selectedFarm)return;
  const hadFarm=!!selectedFarm;if(hadFarm)clearFarm();
  if(selectedArea===area){mapAll.hidden=true;renderAreaPanel();return}
  if(!area&&document.activeElement===mapAll&&selectedArea)pins.get(selectedArea.id).focus({preventScroll:true});
  selectedArea=area;
  mapAll.hidden=!area;mw.classList.toggle('focused',!!area);
  pins.forEach((button,id)=>button.setAttribute('aria-pressed',String(id===area?.id)));
  positionMap();renderAreaPanel();renderPurchaseArea();

function renderAreaPanel(){
  const area=selectedArea,active=area===ME,farm=selectedFarm&&BOF(selectedFarm),open=!!(area||farm);
  const title=document.createElement('span');title.className='feed-title-in';
  title.textContent=farm?`${farm.farm} 출하`:area?`${area.area} ${active?'점포':'후보 점포'}`:'주문 기록';
  feedTitle.replaceChildren(title);
  feed.hidden=feedHead.hidden=open;stores.hidden=!open;
  if(!open){stores.replaceChildren();fitFeed();return}

  let headers,rows,qty=active||!!farm;
  if(farm){
    headers=['식당','주문량','납품'];
    rows=[...farm.stores].sort((a,b)=>b[1]-a[1]).map(([store,q])=>[store,`${q}kg`,`${farm.day}요일`]);
    rows.push(['합계',`${farm.cur} / ${farm.goal}kg`,farm.cur>=farm.goal?'발주 확정':'모집 중']);
  }else if(active){
    headers=['점포','이번 주 주문량','주문 건수'];
    rows=[ME.store,...ST].map(store=>{const stats=S.storeOrders.get(store);return [store,stats?`${fmt(stats.qty)}kg`:'-',`${stats?.count??0}건`]});
  }else{
    headers=['점포','업종','상태'];rows=area.stores.map(([store,type])=>[store,type,'후보']);
  }
  stores.innerHTML=`<div class="fh" role="row">${headers.map(h=>`<span role="columnheader">${h}</span>`).join('')}</div>`+
    `<div class="store-list" role="rowgroup" style="--store-count:${rows.length}">${rows.map(([store,value,status],i)=>
      `<div class="fr${store===ME.store?' mine':''}${farm&&i===rows.length-1?' sum-row':''}" role="row" style="--i:${i}"><span class="c1" role="cell">${store}</span><span${qty&&value!=='-'?' class="store-qty"':''} role="cell">${value}</span><span${qty&&!(farm&&i===rows.length-1)?'':' class="store-status"'} role="cell">${status}</span></div>`).join('')}</div>`;
}
const FEED_MAX=16;
/* rows that fit (max FEED_MAX) share the leftover height as padding */
function fitFeed(){
  if(feed.hidden)return;
  const H=feed.clientHeight,items=$$('.fi',feed);
  feed.style.setProperty('--fx','0px');
  items.forEach(row=>row.classList.remove('cut'));
  let acc=0,n=0;
  for(let i=0;i<items.length&&i<FEED_MAX;i++){const fr=items[i].querySelector('.fr'),h=fr?fr.offsetHeight:44;if(acc+h>H+1)break;acc+=h;n++}
  const fx=n?Math.min(3,Math.max(0,Math.floor((H-acc)/n/2))):0;feed.style.setProperty('--fx',fx+'px');
  items.forEach((li,i)=>li.classList.toggle('cut',i>=n));
}
function addFeed(o,instant){
  const li=document.createElement('div');li.className='fi'+(o.mine?' mine':'');li.dataset.t=o.t||Date.now();
  li.innerHTML=`<div><div class="fr"><span class="c1">${o.store}</span><span class="c3">${pic(o.item)}<em>${IT[o.item].n} ${o.qty}kg</em></span><span class="c4"><i>${BOF(o.item).day}요일</i></span><span class="c5"></span></div></div>`;
  if(!o.mine&&pinned&&pinned.parentNode===feed)pinned.after(li);else feed.prepend(li);
  if(instant)li.classList.add('in');else{const f=requestAnimationFrame(()=>{RAF.delete(f);const f2=requestAnimationFrame(()=>{RAF.delete(f2);li.classList.add('in','hl')});RAF.add(f2)});RAF.add(f)}
  while(feed.children.length>24)feed.lastChild.remove();ftime();fitFeed();
  return li;
}
function ftime(){const now=Date.now();$$('.fi',feed).forEach(li=>{const s=Math.floor((now-li.dataset.t)/1000);$('.c5',li).textContent=s<5?'방금':s<60?s+'초 전':s<3600?Math.floor(s/60)+'분 전':s<86400?Math.floor(s/3600)+'시간 전':Math.floor(s/86400)+'일 전'})}
function seedFeed(){feed.innerHTML='';HIST.slice().sort((a,b)=>b[3]-a[3]).forEach(([st,it,q,m])=>addFeed({store:st,item:it,qty:q,t:Date.now()-m*60000},true))}

// The charts share the quantities used for the totals and the bundle status.
const purchase=$('#purchase'),purchaseTitle=$('#purchaseTitle'),purchaseStatus=$('#purchaseStatus');
const rankList=$('#rankList'),dayBars=$('#dayBars'),weekBars=$('#weekBars');
const fixedColumnScale=Math.max(...BUNDLES.map(b=>b.goal));
const weekScale=BUNDLES.reduce((sum,b)=>sum+b.goal,0);
function buildPurchase(){
  rankList.innerHTML=ITEMS.map(({id,n})=>`<div class="rank-row" data-item="${id}" role="listitem">
    ${pic(id)}<span class="item-name">${n}</span><span class="rank-track"><i></i></span><b></b>
  </div>`).join('');
  dayBars.innerHTML=DAYS.map(day=>`<div class="column" data-day="${day}" role="listitem">
    <div class="column-plot"><i><b></b></i></div><small>${day}</small>
  </div>`).join('');
  weekBars.innerHTML=[...PREVIOUS_WEEKS,0].map((_,i)=>`<div class="column${i===PREVIOUS_WEEKS.length?' current':''}" role="listitem">
    <div class="column-plot"><i>${i===PREVIOUS_WEEKS.length?'<b></b>':''}</i></div>
  </div>`).join('');
  const price=IT.ch.p,discount=Math.round((1-price/RETAIL_CHILI)*100);
  $('#purchasePrice').innerHTML=`<b>${IT.ch.n} ${fmt(price)}원/kg</b><span class="chip">소포장 대비 −${discount}%</span>`;
}
function updatePurchaseBar(bar,kg,scale,flash){
  if(!flash)bar._flash?.cancel();
  if(bar._kg===kg)return;
  if(flash&&bar._kg!==undefined&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    bar._flash?.cancel();
    const base=getComputedStyle(bar).backgroundColor;
    const accent=bar.closest('.current')?'#063d1d':'var(--deep)';
    bar._flash=bar.animate([{backgroundColor:accent},{backgroundColor:accent,offset:.52},{backgroundColor:base}],
      {duration:600,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
  bar._kg=kg;
  bar.style.setProperty('--value',`${kg/scale*100}%`);
}
function renderPurchaseData(flash){
  const sorted=[...BUNDLES].sort((a,b)=>b.cur-a.cur);
  sorted.forEach(({it,cur},index)=>{
    const row=$(`[data-item="${it}"]`,rankList);
    row.style.setProperty('--rank',index);
    row.setAttribute('aria-posinset',index+1);
    row.setAttribute('aria-setsize',sorted.length);
    $('b',row).textContent=`${cur}kg`;
    updatePurchaseBar($('i',row),cur,fixedColumnScale,flash);
  });
  $$('.column',dayBars).forEach((column,index)=>{
    const day=DAYS[index],kg=BUNDLES.reduce((sum,b)=>sum+(b.day===day?b.cur:0),0);
    column.classList.toggle('zero',kg===0);
    column.setAttribute('aria-label',`${day}요일 ${kg}kg`);
    $('b',column).textContent=kg?`${kg}kg`:'';
    updatePurchaseBar($('i',column),kg,fixedColumnScale,flash);
  });
  $$('.column',weekBars).forEach((column,index)=>{
    const kg=PREVIOUS_WEEKS[index]??total(),value=$('b',column);
    column.setAttribute('aria-label',`${index+1}주차 ${kg}kg`);
    if(value)value.textContent=`${kg}kg`;
    updatePurchaseBar($('i',column),kg,weekScale,flash);
  });
}
function renderPurchaseArea(){
  const area=selectedArea??ME,planned=area!==ME;
  purchaseTitle.textContent=`${area.area} 구매 데이터`;
  purchaseStatus.hidden=!planned;
  $('.purchase-grid',purchase).inert=planned;
  purchase.classList.toggle('planned',planned);
  if(planned)$$('i',purchase).forEach(bar=>bar._flash?.cancel());
  purchase.classList.remove('switching');
  void purchase.offsetWidth;
  purchase.classList.add('switching');
}
function renderAdmin(flash=true){
  roll($('#sFull'),nFull());roll($('#sStores'),S.storeOrders.size);roll($('#sRecs'),S.orderCount);
  roll($('#sKg'),total());roll($('#pinN'),total());
  renderPurchaseData(flash);
}
$('#sFullOf').textContent='/ '+BUNDLES.length;

/* order event */
function applyOrder(store,item,qty){
  const bundle=BOF(item);
  bundle.cur+=qty;bundle.stores.set(store,(bundle.stores.get(store)??0)+qty);
  S.orderCount++;
  const stats=S.storeOrders.get(store)??{qty:0,count:0};
  stats.qty+=qty;stats.count++;
  S.storeOrders.set(store,stats);
}
function pushOrder(o){const bb=BOF(o.item);if(bb.cur>=bb.goal)return;o.qty=Math.min(o.qty,bb.goal-bb.cur);ITEMS.forEach(i=>{const x=BOF(i.id),r=Math.max(0,x.goal-x.cur-(i.id===o.item?o.qty:0));if(S.qty[i.id]>r)S.qty[i.id]=r});setArea(null);applyOrder(o.store,o.item,o.qty);renderAdmin();ripple();hotPin();addFeed(o);renderFarms();renderFund();renderMini()}

function clock(){const d=new Date(),p=n=>String(n).padStart(2,'0');$('#ptime').textContent=`${d.getHours()}:${p(d.getMinutes())}`;ftime()}
setInterval(clock,1000);clock();

/* fit: phone scale by height, admin zoom by available size */
let AZ=1;
function fit(){
  const W=innerWidth,H=innerHeight,ps=Math.min((H-36)/790,Math.max(1,W/1670)),cw=Math.round(430*ps);
  const raw=Math.min(1.6,(W-cw)/1000,H/900);AZ=Math.max(.6,raw);$('.admin').classList.toggle('scroll',raw<.6);
  const r=document.documentElement.style;r.setProperty('--ps',ps.toFixed(4));r.setProperty('--colw',cw+'px');r.setProperty('--az',AZ.toFixed(4));
}
fit();
let togT=null,togTok=0;
const togPhone=()=>{
  const h=$('.app').classList.toggle('hide'),tok=++togTok,st=$('.stage'),ph=$('.phone');clearTimeout(togT);
  if(h){cancelHold();st.inert=true}
  else{
    let ft=null;
    const done=()=>{ph.removeEventListener('transitionend',te);clearTimeout(ft);if(tok!==togTok||$('.app').classList.contains('hide'))return;st.inert=false;if(sheetOpen)$('#sheetGo').focus({preventScroll:true})};
    const te=e=>{if(e.target===ph&&e.propertyName==='transform')done()};
    ph.addEventListener('transitionend',te);ft=setTimeout(done,800);
  }
  togT=setTimeout(()=>window.dispatchEvent(new Event('resize')),700);
};
$('#tog').onclick=togPhone;

/* reset (R) */
function resetDemo(){
  TM.forEach(clearTimeout);TM=[];cancelHold();clearTimeout(S.cfT);clearTimeout(S.hotT);clearTimeout(togT);
  RAF.forEach(cancelAnimationFrame);RAF.clear();
  setArea(null);
  busy=false;sheetOpen=false;pinned=null;S.done={};
  hold.classList.remove('loading','done','pressing','shake');
  $('#scrim').classList.remove('show');$('#sheet').classList.remove('show');$('#scrim').inert=true;$('#sheet').inert=true;behind(false);
  $('#sheet').classList.remove('pending');$('#sheetT').textContent='';$('#rcpt').innerHTML='';
  $$('.cf,.rip').forEach(e=>e.remove());$$('.row.flash',ol).forEach(r=>r.classList.remove('flash'));
  pin.classList.remove('hot');$$('.route.go,.farm-tag.go').forEach(e=>e.classList.remove('go'));
  initData();renderOrder();seedFeed();
  if($('.app').classList.contains('hide'))togPhone();
  if(tab!==0)go(0);else renderFarms();
  ol.scrollTop=0;$('#p2').scrollTop=0;$('.panes').scrollLeft=0;
  purchase.classList.remove('switching');renderAdmin(false);renderFund();
}
document.addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='INPUT')return;
  if(e.code==='KeyH')togPhone();
  else if(e.code==='KeyR')resetDemo();
});
/* boot */
seedFeed();
renderOrder();placeTab();
renderMap();fitMap();buildPurchase();renderAdmin(false);
new ResizeObserver(fitFeed).observe(feed);
new ResizeObserver(fitMap).observe(mapbox);
setTimeout(()=>{document.body.classList.remove('loading');renderFarms();renderFund();fitFeed()},950);
if(document.fonts)document.fonts.ready.then(()=>{fit();placeTab();fitMap();fitFeed()});
let rzF=0;window.addEventListener('resize',()=>{cancelAnimationFrame(rzF);rzF=requestAnimationFrame(()=>{fit();placeTab();fitFeed()})});
</script>
