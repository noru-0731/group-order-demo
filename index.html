<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공동 발주 시연</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<style>
:root{--bg:#f6f7f4;--card:#fff;--line:#e6e8e3;--ink:#15181a;--sub:#6d726b;--mute:#a3a8a0;--g:#16a05c;--g2:#e7f6ee;--g3:#c9ebd8;--r:14px;--spring:cubic-bezier(.3,1.35,.5,1);--out:cubic-bezier(.2,.9,.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root{--colw:430px;--ps:1;--az:1}
.app{display:grid;grid-template-columns:var(--colw) 1fr;height:100vh;transition:grid-template-columns .65s cubic-bezier(.65,0,.2,1)}
.app.hide{grid-template-columns:0px 1fr}
.stage{min-width:0;overflow:hidden;position:relative}
.phone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--ps));transition:transform .65s cubic-bezier(.65,0,.2,1),opacity .5s}
.app.hide .phone{transform:translate(-50%,-50%) translateX(-110%) scale(calc(var(--ps) * .92));opacity:0}
.tog{position:fixed;top:50%;left:var(--colw);z-index:60;width:26px;height:64px;margin-top:-32px;border-radius:0 14px 14px 0;background:#fff;border:1px solid var(--line);border-left:0;box-shadow:4px 0 14px -8px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--sub);transition:left .65s cubic-bezier(.65,0,.2,1),color .2s,width .25s var(--spring)}
.tog:hover{color:var(--g);width:32px}
.tog svg{width:18px;height:18px;transition:transform .5s var(--spring)}
.app.hide~.tog svg{transform:rotate(180deg)}
.app.hide~.tog{left:0}

/* roll */
.roll{display:inline-flex;white-space:nowrap}
.rd{display:inline-block;height:1.1em;overflow:hidden;line-height:1.1em}
.rc{display:flex;flex-direction:column;transition:transform .9s var(--out)}
.rc span{height:1.1em;line-height:1.1em;text-align:center}
.rs{line-height:1.1em;white-space:pre}

/* keyframes */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}
@keyframes bump{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-50%) scale(1.35)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes rip{from{width:10px;height:10px;opacity:1}to{width:90px;height:90px;opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,160,92,.55)}100%{box-shadow:0 0 0 9px rgba(22,160,92,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hl{0%{background:#d9f2e4}100%{background:transparent}}
@keyframes hl2{from{background:#eff8f3}}
@keyframes hlm{0%,45%{background:#16a05c;color:#fff}100%{background:#e4f5eb}}
.fi.mine.in.hl .fr b,.fi.mine.in.hl .fr span,.fi.mine.in.hl .fr .q,.fi.mine.in.hl .fr small{animation:hlmt 2.4s ease-out}
@keyframes hlmt{0%,45%{color:#fff}}
@keyframes rowfl{from{background:#dcf2e5;border-color:var(--g)}}

/* card + skeleton */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:relative;transition:transform .3s var(--out),box-shadow .3s;animation:up .6s var(--out) both;animation-delay:var(--d,0ms)}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(20,40,25,.28)}
.card>*{transition:opacity .5s}
body.loading .card>*{opacity:0}
body.loading .card::after{content:"";position:absolute;inset:14px;border-radius:10px;background:linear-gradient(90deg,#f0f1ed 25%,#f8f9f6 50%,#f0f1ed 75%);background-size:200% 100%;animation:shim 1.1s linear infinite}

/* progress bar */
.bar{height:8px;border-radius:99px;background:#eef0ec;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#2cc277,#16a05c);transition:width 1.2s var(--out);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sheen 2.4s ease-in-out infinite}

.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--g2);color:var(--g)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}


/* ===== phone ===== */
.stage{display:grid;place-items:center;background:radial-gradient(circle at 30% 15%,#fff 0,#eceee9 70%);border-right:1px solid var(--line)}
.phone{width:372px;height:790px;border-radius:54px;background:#121412;padding:10px;box-shadow:0 40px 70px -30px rgba(20,35,25,.45),inset 0 0 0 2px #2c2f2c}
.screen{position:relative;height:100%;border-radius:44px;background:#f9faf8;overflow:hidden;display:flex;flex-direction:column}
.sbar{height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0;font-size:14px;font-weight:700}
.phead{display:flex;align-items:center;gap:8px;padding:4px 20px 12px}
.phead h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.panes{flex:1;overflow:hidden;position:relative}
.track{display:flex;width:200%;height:100%;transition:transform .6s cubic-bezier(.65,0,.2,1)}
.pane{width:50%;height:100%;overflow-y:auto;padding:2px 16px 18px;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.pane.show .stag{animation:up .55s var(--out) both;animation-delay:calc(var(--i,0)*70ms)}
.tabbar{height:78px;display:flex;position:relative;border-top:1px solid var(--line);background:#fff;padding:8px 14px 22px}
.tabbar .pill{position:absolute;top:8px;height:48px;border-radius:16px;background:var(--g2);transition:left .5s var(--spring),width .5s var(--spring)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);transition:color .3s,transform .15s}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--g)}

.tile{width:44px;height:44px;border-radius:13px;background:#f2f4ef;display:grid;place-items:center;font-size:24px;flex:none;transition:transform .4s var(--spring),background .3s}
.dd{font-size:11px;font-weight:800;color:#e0542e;background:#fdece6;padding:3px 7px;border-radius:7px}

/* order */
.pane.order{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
.olist{flex:1;overflow-y:auto;margin:12px -16px 0;padding:0 16px 10px;scrollbar-width:none}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;transition:border-color .3s,background .3s,transform .3s var(--out),box-shadow .3s}
.row.has{border-color:var(--g3);background:#fbfefc}
.row.has .tile{background:var(--g2);transform:rotate(-6deg) scale(1.05)}
.row .inf{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:700;white-space:nowrap}
.row .nm small{font-size:11px;color:var(--mute);font-weight:600;margin-left:4px}
.row .pr{white-space:nowrap;font-size:12.5px;margin-top:3px;display:flex;gap:6px;align-items:center}
.row .pr b{font-weight:800}
.row .pr s{color:var(--mute)}
.row .pr em{font-style:normal;color:var(--g);font-weight:800;font-size:11px}
.step{display:flex;align-items:center;background:#f1f2ee;border-radius:12px;padding:3px}
.step button{width:28px;height:30px;border-radius:9px;font-size:18px;font-weight:700;display:grid;place-items:center;transition:background .2s,transform .15s var(--spring)}
.step button:hover{background:#fff}
.step button:active{transform:scale(.8)}
.step .q{width:52px;text-align:center;font-weight:800;font-size:15px;display:flex;justify-content:center}
.step .q .rs{font-size:11.5px;color:var(--sub);align-self:flex-end;padding-bottom:1px}
.row.flash{animation:rowfl 1.6s ease-out .3s both}
.sum{border-top:1px solid var(--line);background:#fff;margin:0 -16px;padding:12px 18px 14px}
.sum .sl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:4px}
.sum .sl .roll{font-size:18px;font-weight:800;color:var(--ink)}
.sum .sl.sv .roll{color:var(--g);font-size:15px}
.hold{position:relative;display:block;margin:10px auto 0;width:100%;height:54px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;overflow:hidden;transition:width .5s cubic-bezier(.6,0,.2,1),border-radius .5s,transform .2s var(--spring),opacity .3s,background .3s;touch-action:none;user-select:none}
.hold .fill{position:absolute;inset:0;background:var(--g);transform-origin:left;transform:scaleX(0);transition:transform .35s ease-out}
.hold.pressing{transform:scale(.97)}
.hold.pressing .fill{transform:scaleX(1);transition:transform 1.1s linear}
.hold .lbl{position:relative;transition:opacity .2s}
.hold.off{opacity:.35}
.hold.shake{animation:shake .45s}
.hold.loading,.hold.done{width:54px;border-radius:27px;background:var(--g)}
.hold.loading .lbl,.hold.done .lbl{opacity:0}
.hold .spn{position:absolute;inset:15px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;opacity:0}
.hold.loading .spn{opacity:1;animation:spin .7s linear infinite}
.hold .ok{position:absolute;inset:0;margin:auto;width:26px;height:26px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.hold.done .ok{animation:draw .3s var(--out) forwards}

.scrim{position:absolute;inset:0;background:rgba(12,18,14,.38);opacity:0;pointer-events:none;transition:opacity .4s;z-index:19;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:26px 22px 28px;transform:translateY(105%);transition:transform .65s cubic-bezier(.2,1.15,.3,1);z-index:20;text-align:center}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#e2e4df;margin:-12px auto 18px}
.ck{width:68px;height:68px;border-radius:50%;background:var(--g);margin:0 auto 14px;display:grid;place-items:center;transform:scale(0)}
.sheet.show .ck{animation:pop .5s var(--spring) .1s forwards}
.ck svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.sheet.show .ck svg{animation:draw .4s var(--out) .4s forwards}
.sheet h3{font-size:22px;font-weight:800}
.rcpt{margin:18px 0;text-align:left;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rcpt .top{background:var(--g2);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.rcpt .top span{font-size:13px;font-weight:700;color:var(--g)}
.rcpt .top .roll{font-size:24px;font-weight:800;color:var(--g)}
.rcpt .li{display:flex;justify-content:space-between;padding:9px 16px;font-size:13.5px;border-top:1px solid #f0f1ed;opacity:0}
.sheet.show .rcpt .li{animation:up .4s var(--out) forwards;animation-delay:calc(.4s + var(--i)*60ms)}
.rcpt .li b{font-weight:700}
.sheet .go{width:100%;height:52px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;transition:transform .15s}
.sheet .go:active{transform:scale(.96)}
.cf{position:absolute;width:6px;height:9px;border-radius:2px;z-index:25;pointer-events:none}

/* farms */
.fc{padding:14px;margin-bottom:10px;cursor:pointer;user-select:none}
.fc:active{transform:scale(.98)}
.fc .ft{display:flex;gap:12px;align-items:center}
.fc .fn{flex:1;min-width:0}
.fc .fn b{font-size:15px;font-weight:800;display:block}
.fc .fn span{font-size:12px;color:var(--sub);font-weight:600}
.fc .pg{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 7px}
.fc .pg .roll{font-size:22px;font-weight:800;color:var(--g)}
.fc .pg small{font-size:12px;color:var(--sub);font-weight:600}
.fc .bar{height:10px}
.fc .fb{display:flex;justify-content:space-between;align-items:center;margin-top:11px}
.fc .fb .lg{font-size:clamp(12.5px,calc(11.5px / var(--ps)),14px);color:#868b83}

/* ===== admin ===== */
.admin{height:100vh;overflow:hidden;background:#fbfbf9;min-width:0}
.admin.scroll{overflow:auto}
.admin.scroll .main{min-width:1000px;min-height:900px}
.main{zoom:var(--az);height:calc(100vh / var(--az));max-width:1500px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;padding:16px 20px;overflow:hidden}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--g);background:var(--g2);padding:7px 12px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 1.4s infinite}

.big{display:flex;align-items:center;gap:20px;padding:12px 22px}
.big .lb{font-size:16px;font-weight:800;color:var(--sub);white-space:nowrap}
.big .num{display:flex;align-items:baseline;gap:8px}
.big .num .roll{font-size:54px;font-weight:800;letter-spacing:-1.8px}
.big .num small{font-size:20px;color:var(--sub);font-weight:700;margin-right:8px}
.big .live{margin-left:auto}

.body{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;min-height:0}
.lcol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;min-height:0}
.mapc{padding:14px 16px;display:flex;flex-direction:column;min-height:0}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch h3{font-size:17px;font-weight:800}
.lg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mute);font-weight:700}
.mapc .lg{font-size:13px}
.lg i{width:90px;height:7px;border-radius:9px;background:linear-gradient(90deg,#e6f4ea 0 20%,#bfe5cc 20% 40%,#8fd1a9 40% 60%,#4fb07c 60% 80%,#1f8a52 80%)}
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:12px;container-type:size;display:grid;place-items:center;--mp:12px}
.mapwrap{position:relative;width:min(calc(100cqw - 2 * var(--mp)),calc((100cqh - 2 * var(--mp)) * 800 / 658));aspect-ratio:800/658;isolation:isolate}
.mapwrap::before{content:"";position:absolute;inset:calc(-1 * var(--mp));border-radius:12px;background:#f7f8f5;z-index:-1}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mapwrap path{stroke:#fff;stroke-width:1.6;transition:fill .8s var(--out),transform .35s var(--spring),filter .35s;transform-box:fill-box;transform-origin:center}
.mapwrap path:hover{transform:translateY(-4px) scale(1.03);filter:drop-shadow(0 8px 8px rgba(10,60,30,.28))}
.pin{position:absolute;transform:translate(-50%,-50%);font-size:clamp(13px,min(2.2cqw,2.67cqh),17px);font-weight:800;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.14);pointer-events:none;color:var(--ink)}
.pin{transition:background .6s cubic-bezier(.2,.8,.2,1),color .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.pin.me{z-index:2;color:var(--g);box-shadow:0 0 0 1.5px var(--g3),0 1px 4px rgba(0,0,0,.14)}
.pin.me.hot{background:var(--ink);color:#fff;transform:translate(-50%,-50%) scale(1.15)}
.rip{position:absolute;border-radius:50%;border:2.5px solid var(--g);transform:translate(-50%,-50%);animation:rip 1.3s ease-out forwards;pointer-events:none}
.tip{position:fixed;z-index:50;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:7px 10px;border-radius:9px;pointer-events:none;opacity:0;transform:translate(12px,12px) scale(.9);transition:opacity .15s,transform .2s var(--spring)}
.tip.on{opacity:1;transform:translate(12px,12px) scale(1)}
.tip span{color:#9ee6bd;margin-left:6px}

.feedc{padding:14px 0 0;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.feedc .ch{padding:0 16px}
.feedc .cnt{font-size:15px;font-weight:800;color:var(--sub);display:inline-flex;white-space:pre}
.feed{flex:1;min-height:0;overflow:hidden;position:relative}
.fi{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--out)}
.fi.in{grid-template-rows:1fr}
.fi.cut{visibility:hidden}
.fi>div{overflow:hidden}
.fr{display:flex;align-items:center;gap:12px;padding:11px 16px;border-left:3px solid transparent;transform:translateX(-20px);opacity:0;transition:transform .5s var(--out),opacity .4s}
.fi.in .fr{transform:none;opacity:1}
.fi.in.hl .fr{animation:hl2 1.8s ease-out}
.fi.mine .fr{border-left:6px solid var(--g);background:#e4f5eb;padding:14px 16px 14px 13px}
.fi.mine.in.hl .fr{animation:hlm 2.4s ease-out}
.fi.mine .av{width:40px;height:40px;font-size:16px}
.fi.mine .tx b{font-size:21px}
.fi.mine .tx span{font-size:14.5px;color:#2f5c43;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi.mine .fr .q{font-size:22px}
.fr .av{width:34px;height:34px;font-size:14px}
.fr .tx{flex:1;min-width:0}
.fr .tx b{font-size:16px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .tx span{font-size:13.5px;color:var(--sub);font-weight:600}
.fr .q{text-align:right;font-size:17px;font-weight:800;color:var(--g);white-space:nowrap}
.fr .q small{display:block;font-size:clamp(12.5px,calc(11.5px / var(--az)),15px);color:#868b83;font-weight:600}

.lc{padding:14px 18px 12px}
.bars{display:flex;flex-direction:column;gap:3px}
.br{display:grid;grid-template-columns:24px 72px 1fr 96px;align-items:center;gap:10px;padding:5px 6px;border-radius:9px;font-size:15px;font-weight:700}
.br.upd{animation:hl 1.6s}
.br .rk{font-size:14px;color:var(--mute);font-weight:800;text-align:center}
.br:nth-child(-n+3) .rk{color:var(--g)}
.br .bt{height:12px;border-radius:6px;background:#f0f1ed;overflow:hidden}
.br .bt i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#8fd6af,#16a05c);transition:width .9s var(--out)}
.br .roll{justify-content:flex-end;font-size:15px}

/* ===== admin calm ===== */
.admin{--ease:cubic-bezier(.2,.8,.2,1)}
.admin .card{animation-duration:.4s}
.admin .card:hover{transform:none;box-shadow:none}
.admin .rc{transition-duration:.45s}
.admin .bar i{transition:width .45s var(--ease)}
.admin .bar i::after{display:none}
.admin .mapwrap path{transition:fill .4s ease,stroke .15s}
.admin .mapwrap path:hover{transform:none;filter:none;stroke:var(--ink);stroke-width:2}
.admin .fi{transition:grid-template-rows .35s var(--ease)}
.admin .fr{transform:none;transition:opacity .3s}
.admin .br .bt i{transition:width .45s var(--ease)}
.tip{transition:opacity .12s}
.tip,.tip.on{transform:translate(12px,12px)}
.sheet .go:focus{outline:none}.sheet .go:focus-visible{box-shadow:0 0 0 4px var(--g3)}
</style>
</head>
<body class="loading">
<div class="app">

<section class="stage">
 <div class="phone"><div class="screen" id="screen">
  <div class="sbar"><span id="ptime">9:41</span><span>●●● ▮</span></div>
  <div class="phead">
   <span class="av" style="background:#16a05c">성</span>
   <h2>성수 한끼식당</h2><span class="chip">성동구</span>
  </div>
  <div class="panes"><div class="track" id="track">
   <div class="pane farms show" id="p2">
    <div id="flist"></div>
   </div>

   <div class="pane order" id="p1" inert>
    <div class="olist" id="olist"></div>
    <div class="sum">

['pointerup','pointercancel','lostpointercapture'].forEach(ev=>hold.addEventListener(ev,e=>{if(e.pointerId===hp)cancelHold()}));
