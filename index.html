<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소쿠리 공동발주 시연</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<meta name="description" content="동네 식당과 농가를 잇는 공동발주 서비스 소쿠리 시연">
<meta property="og:type" content="website">
<meta property="og:url" content="https://noru-0731.github.io/sokuri/">
<meta property="og:title" content="소쿠리 공동발주 시연">
<meta property="og:description" content="동네 식당과 농가를 잇는 공동발주 서비스">
<meta property="og:image" content="https://noru-0731.github.io/sokuri/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<style>
:root{--bg:#f6f4ee;--card:#fff;--line:#e8e4d8;--ink:#1b211c;--sub:#666b60;--mute:#9a9e92;--soil:#8a5a2b;--soil2:#e9dcc6;--g:#0f9547;--deep:#0a5c2c;--yellow:#ffd43a;--mine:#fff59a;--g2:#e3f6e9;--g3:#c5ebd0;--r:14px;--spring:cubic-bezier(.3,1.35,.5,1);--out:cubic-bezier(.2,.9,.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root{--colw:430px;--ps:1;--az:1}
.app{display:grid;grid-template-columns:var(--colw) 1fr;height:100vh;transition:grid-template-columns .65s cubic-bezier(.65,0,.2,1)}
.app.hide{grid-template-columns:0px 1fr}
.stage{min-width:0;overflow:hidden;position:relative}
.phone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--ps));transition:transform .65s cubic-bezier(.65,0,.2,1),opacity .5s}
.app.hide .phone{transform:translate(-50%,-50%) translateX(-110%) scale(calc(var(--ps) * .92));opacity:0}
.tog{position:fixed;top:50%;left:var(--colw);z-index:60;width:26px;height:64px;margin-top:-32px;border-radius:0 14px 14px 0;background:#fff;border:1px solid var(--line);border-left:0;box-shadow:4px 0 14px -8px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--sub);transition:left .65s cubic-bezier(.65,0,.2,1),color .2s,width .25s var(--spring)}
.tog:hover{color:var(--g);width:32px}
.tog svg{width:18px;height:18px;transition:transform .5s var(--spring)}
.app.hide~.tog svg{transform:rotate(180deg)}
.app.hide~.tog{left:0}

/* roll */
.roll{display:inline-flex;white-space:nowrap}
.rd{display:inline-block;height:1.1em;overflow:hidden;line-height:1.1em}
.rc{display:flex;flex-direction:column;transition:transform .9s var(--out)}
.rc span{height:1.1em;line-height:1.1em;text-align:center}
.rs{line-height:1.1em;white-space:pre}

/* keyframes */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}
@keyframes rip{from{width:10px;height:10px;opacity:1}to{width:90px;height:90px;opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,149,71,.55)}100%{box-shadow:0 0 0 9px rgba(15,149,71,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hl2{from{background:#e3f6e9}}
@keyframes hlm{0%,24%{background:var(--yellow)}100%{background:var(--mine)}}
@keyframes rowfl{from{background:#dff4e6;border-color:var(--g)}}
@keyframes ddin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes store-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* card + skeleton */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:relative;transition:transform .3s var(--out),box-shadow .3s;animation:up .6s var(--out) both;animation-delay:var(--d,0ms)}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(20,27,48,.28)}
.card>*{transition:opacity .5s}
body.loading .card>*{opacity:0}
body.loading .card::after{content:"";position:absolute;inset:14px;border-radius:10px;background:linear-gradient(90deg,#eeebe3 25%,#fbfaf6 50%,#eeebe3 75%);background-size:200% 100%;animation:shim 1.1s linear infinite}

/* progress bar */
.bar{height:8px;border-radius:99px;background:#efede6;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#2fae5e,#0f9547);transition:width 1.2s var(--out);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sheen 2.4s ease-in-out infinite}

.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--g2);color:var(--g)}
.av{width:34px;height:34px;border-radius:11px;background:var(--g2);display:grid;place-items:center;flex:none}
.av img{width:26px;height:26px;display:block;user-select:none}

/* ===== phone ===== */
.stage{display:grid;place-items:center;background:radial-gradient(circle at 30% 15%,#fffdf6 0,#ece6d6 75%);border-right:1px solid var(--line)}
.phone{width:372px;height:790px;border-radius:54px;background:#12141c;padding:10px;box-shadow:0 40px 70px -30px rgba(20,26,48,.45),inset 0 0 0 2px #2c303e}
.screen{position:relative;height:100%;border-radius:44px;background:#f6f4ee;overflow:hidden;display:flex;flex-direction:column}
.sbar{height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0;font-size:14px;font-weight:700}
.sic{display:flex;align-items:center;gap:6px}
.sic svg{display:block;fill:var(--ink)}
.phead{display:flex;align-items:center;gap:8px;padding:4px 20px 12px}
.phead h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.phead .papp{margin-left:auto;width:32px;height:32px;display:block;user-select:none}
.phead .av{width:38px;height:38px;border-radius:12px}
.phead .av img{width:28px;height:28px}
.panes{flex:1;min-height:0;overflow:hidden;overflow:clip;position:relative}
.track{display:flex;width:200%;height:100%;transition:transform .6s cubic-bezier(.65,0,.2,1)}
.pane{width:50%;height:100%;overflow-y:auto;padding:2px 16px 18px;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.pane.show .stag{animation:up .55s var(--out) both;animation-delay:calc(var(--i,0)*70ms)}
.tabbar{height:78px;display:flex;position:relative;border-top:1px solid var(--line);background:#fff;padding:8px 14px 22px}
.tabbar .pill{position:absolute;top:8px;height:48px;border-radius:16px;background:var(--g2);transition:left .5s var(--spring),width .5s var(--spring)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;color:var(--mute);transition:color .3s,transform .15s}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--g)}
.tab svg.i{width:23px;height:23px}

.tile{width:44px;height:44px;border-radius:13px;background:#f2efe7;display:grid;place-items:center;flex:none;transition:transform .4s var(--spring),background .3s}
.tile img{width:34px;height:34px;display:block;user-select:none;pointer-events:none}
.dd{font-size:11px;font-weight:800;color:#6a6f63;background:#eeebe3;padding:3px 7px;border-radius:7px;white-space:nowrap}
.dd.ok{color:#fff;background:var(--g);animation:ddin .18s ease-out}
.dds{display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:flex-start}

/* order */
.pane.order{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
.olist{flex:1;overflow-y:auto;margin:12px -16px 0;padding:0 16px 10px;scrollbar-width:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:18px 14px 16px;margin-bottom:12px;transition:border-color .3s,background .3s,transform .3s var(--out),box-shadow .3s}
.row.has{border-color:var(--g3);background:#f6fcf8}
.row.has .tile{background:var(--g2);transform:rotate(-6deg) scale(1.05)}
.row .inf{flex:1;min-width:0;overflow:hidden}
.row .nm{font-size:17px;font-weight:800;white-space:nowrap}
.row .fm{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:12px;font-weight:700;color:var(--soil);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .fm .farm-chip{font-size:10.5px;padding:1px 5px}
.row .pr{white-space:nowrap;font-size:14.5px;margin-top:4px;letter-spacing:-.2px;display:flex;align-items:baseline;gap:6px}
.row .pr span{font-size:12px;color:var(--sub);font-weight:600}
.row .pr b{font-weight:800}
.row .sp{font-size:12px;color:var(--sub);font-weight:600;margin-top:3px;white-space:nowrap}
.row .mp{flex-basis:100%;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.row .mb{flex-basis:100%;flex:none;width:100%;margin-top:-4px}
.row .msg{font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.row .msg b{color:var(--ink);font-weight:800}
.row .msg.done{color:var(--g);font-weight:800}
.hotb{font-style:normal;font-size:11px;font-weight:800;color:#712B13;background:#FAECE7;padding:2px 6px;border-radius:6px;margin-left:7px;vertical-align:2px}
.hotb[hidden]{display:none}
.row .mp .dd{flex:none}
.mb{min-width:0;height:8px;border-radius:99px;background:#efede6;overflow:hidden;display:flex}
.mb i{display:block;height:100%;width:0;flex:none;transition:width .45s var(--out)}
.mb .b0{background:#9fdcb3}
.mb .b1{background:var(--g)}
.mt{flex:none;font-size:13px;font-weight:800;color:#666b60;white-space:nowrap}
.mt b{color:var(--g);font-weight:800}
.row .ft{flex-basis:100%;display:flex;align-items:center;gap:7px;margin-top:-2px;font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.row .ft .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .ft .msg b{color:var(--ink);font-weight:800}
.row .ft .dl2{flex:none;font-size:11.5px;color:#8a8d80}
.stt{flex:none;font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:7px}
.stt.wait{color:#666b60;background:#efede6}
.stt.near{color:var(--deep);background:var(--g2)}
.stt.hot{color:#fff;background:#d9622b}
.stt.ok{color:#fff;background:var(--g)}
.step{display:flex;align-items:center;background:#efede6;border-radius:12px;padding:3px}
.step button{width:28px;height:30px;border-radius:9px;font-size:18px;font-weight:700;display:grid;place-items:center;transition:background .2s,transform .15s var(--spring)}
.step button:hover{background:#fff}
.step button:active{transform:scale(.8)}
.step .q{width:52px;text-align:center;font-weight:800;font-size:15px;display:flex;justify-content:center}
.step .q .rs{font-size:11.5px;color:var(--sub);align-self:flex-end;padding-bottom:1px}
.row.flash{animation:rowfl 1.6s ease-out .3s both}
.sum{border-top:1px solid var(--line);background:#fff;margin:0 -16px;padding:12px 18px 14px}
.sum .sl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:4px}
.sum .sl .roll{font-size:18px;font-weight:800;color:var(--ink)}
.hold{position:relative;display:block;margin:10px auto 0;width:100%;height:54px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;overflow:hidden;transition:width .5s cubic-bezier(.6,0,.2,1),border-radius .5s,transform .2s var(--spring),opacity .3s,background .3s;touch-action:none;user-select:none}
.hold .fill{position:absolute;inset:0;background:var(--g);transform-origin:left;transform:scaleX(0);transition:transform .35s ease-out}
.hold.pressing{transform:scale(.97)}
.hold.pressing .fill{transform:scaleX(1);transition:transform .55s linear}
.hold .lbl{position:relative;transition:opacity .2s}
.hold.off{opacity:.35}
.hold.shake{animation:shake .45s}
.hold.loading,.hold.done{width:54px;border-radius:27px;background:var(--g)}
.hold.loading .lbl,.hold.done .lbl{opacity:0}
.hold .spn{position:absolute;inset:15px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;opacity:0}
.hold.loading .spn{opacity:1;animation:spin .7s linear infinite}
.hold .ok{position:absolute;inset:0;margin:auto;width:26px;height:26px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.hold.done .ok{animation:draw .3s var(--out) forwards}

.scrim{position:absolute;inset:0;background:rgba(12,16,38,.38);opacity:0;pointer-events:none;transition:opacity .4s;z-index:19;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:26px 22px 28px;max-height:100%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .65s cubic-bezier(.2,1.15,.3,1);z-index:20;text-align:center}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#e3dfd4;margin:-12px auto 18px}
.ck{width:68px;height:68px;border-radius:50%;background:var(--g);margin:0 auto 14px;display:grid;place-items:center;transform:scale(0)}
.sheet.show .ck{animation:pop .5s var(--spring) .1s forwards}
.ck svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.sheet.show .ck svg{animation:draw .4s var(--out) .4s forwards}
.sheet h3{font-size:22px;font-weight:800}
.sheet .grab,.sheet .ck,.sheet h3,.sheet .go{flex:none}
.sheet.pending .ck{display:none}
.rcpt{margin:15px 0;text-align:left;border:1px solid var(--line);border-radius:16px;overflow:auto;min-height:0;overscroll-behavior:contain}
.receipt+.receipt{border-top:1px solid var(--line)}
.rcpt .top{background:var(--g2);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rcpt .ri{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800}
.rcpt .rt{width:27px;height:27px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none}
.rcpt .rt img{width:22px;height:22px;display:block}
.rcpt .tv{font-size:26px;font-weight:800;color:var(--g);letter-spacing:-.5px;white-space:nowrap}
.rcpt .met{padding:8px 14px;color:var(--deep);font-size:13px;font-weight:800;background:var(--g2)}
.rcpt .li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 14px;font-size:14px;font-weight:650;border-top:1px solid var(--line)}
.sheet.show .rcpt .li{animation:up .4s var(--out) both;animation-delay:calc(.35s + var(--i)*48ms)}
.rcpt .li b,.rcpt .li small{white-space:nowrap}
.rcpt .li.me{color:var(--deep);background:var(--mine);font-weight:800}
.rcpt .li small{margin-left:4px;font-size:11px}
.rcpt .compact .li,.rcpt.multi .li{padding-block:4px;font-size:12px}
.rcpt .receipt-totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.rcpt .receipt-totals div{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:10px 12px;font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
.rcpt .receipt-totals div+div{border-left:1px solid var(--line)}
.rcpt .receipt-totals b{font-size:15px;color:var(--deep)}
.rcpt .delivery{padding:7px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);font-weight:700}
.sheet .go{width:100%;height:52px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;transition:transform .15s}
.sheet .go:active{transform:scale(.96)}
.sheet .go:focus{outline:none}.sheet .go:focus-visible{box-shadow:0 0 0 4px var(--g3)}
.cf{position:absolute;width:6px;height:9px;border-radius:2px;z-index:25;pointer-events:none}
.cf.w{box-shadow:0 0 0 1px #c5ebd0}

/* bundle cards */
.fc{padding:14px;margin-bottom:10px;cursor:pointer;user-select:none;overflow:hidden}
.fc:active{transform:scale(.98)}
.fc .ft{display:flex;gap:12px;align-items:center}
.fband{position:relative;height:40px;margin:-14px -14px 12px;border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;overflow:hidden;display:flex;align-items:center;padding:0 14px;background:linear-gradient(115deg,var(--b1),var(--b2))}
.fband::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-14deg,transparent 0 10px,rgba(255,255,255,.16) 10px 12px)}
.fband img{position:absolute;right:16px;top:4px;width:50px;height:50px;transform:rotate(-14deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));pointer-events:none}
.freg{position:relative;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.freg svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2}
.fc .ft .tile{display:none}
.fb-ch{--b1:#7cb86a;--b2:#2f7d3e}
.fb-on{--b1:#e0b25e;--b2:#b07a33}
.fb-mu{--b1:#b8987a;--b2:#7a5b40}
.fc .fn{flex:1;min-width:0}
.fc .fn b{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;letter-spacing:-.3px}
.farm-chip{flex:none;font-style:normal;font-size:11.5px;font-weight:800;color:#fff;background:var(--soil);padding:2px 6px;border-radius:6px;letter-spacing:0}
.fc .fn span{font-size:12px;color:var(--sub);font-weight:600}
.fc .pg{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 7px}
.fc .pv{display:flex;align-items:baseline;font-size:24px;font-weight:800;color:var(--g)}
.fc .pv .gl{color:#7a7f72;font-size:17px;font-weight:700;white-space:pre}
.fc .pg small{font-size:clamp(12.5px,calc(11.5px / var(--ps)),14px);color:#666b60;font-weight:600}
.fc .bar{height:10px;flex:1;min-width:0}
.fc .bw{display:flex;align-items:center;gap:10px}
.fc .arw{flex:none;width:18px;height:18px;margin-right:-4px;color:#9a9e92;transition:transform .25s var(--out),color .25s}
.fc .arw svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fc:hover .arw{color:var(--g);transform:translateX(2px)}

/* ===== admin ===== */
.admin{height:100vh;overflow:hidden;background:#f6f4ee;min-width:0}
.admin.scroll{overflow:auto}
.admin.scroll .main{min-width:1000px;min-height:900px}
.main{zoom:var(--az);height:calc(100vh / var(--az));max-width:1500px;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:14px;padding:16px 20px;overflow:hidden}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--g);background:var(--g2);padding:7px 12px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 1.4s infinite}

.big{display:flex;align-items:center;padding:9px 18px}
.st{display:flex;align-items:baseline;gap:8px;padding:0 18px;border-left:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;margin-right:20px}
.brand img{width:36px;height:36px;display:block;user-select:none}
.wordmark{font-size:20px;font-weight:900;color:var(--deep);letter-spacing:-.6px;white-space:nowrap}
.st .lb{font-size:13px;font-weight:800;color:var(--sub);white-space:nowrap}
.st .num{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.st .num .roll{font-size:24px;font-weight:800;letter-spacing:-.6px}
.st .num small{font-size:14px;color:var(--sub);font-weight:700}
.big .live{margin-left:auto}

.body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px;min-height:0}

.mlab{position:absolute;transform:translate(-50%,calc(-100% - 20px));font-size:12px;font-weight:800;color:var(--deep);background:#fff;padding:3px 7px;border-radius:7px;box-shadow:0 0 0 1px var(--g3),0 2px 5px rgba(0,0,0,.1);white-space:nowrap;pointer-events:none}

.mini svg .pt{fill:#a9ab9c}
.mini svg .pt.on{fill:var(--g)}
.mdl[hidden]{display:none}
.mini svg .cand{fill:none;stroke:#BA7517;stroke-width:1.6;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.mini svg path.opline{fill:none;stroke:#5fbf80;stroke-width:1.4;vector-effect:non-scaling-stroke}
.mini svg .gc{stroke:none}
.mlab[data-a="market"]{transform:translate(-50%,calc(-100% - 20px))}
.mdot{position:absolute;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;border:2.5px dashed #2fae5e}
.mdot.on{width:20px;height:20px;background:var(--g);border:3px solid #fff;box-shadow:0 0 0 1px var(--g)}
.mini-list{display:flex;flex-direction:column;gap:10px}
.ml{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;font-weight:700}
.ml i{width:12px;height:12px;border-radius:50%;border:2px dashed #6fcb8e;background:#fff}
.ml.on i{border:0;background:var(--g)}
.ml:not(.on) i{border:2px dashed #BA7517;background:#fff}
.ml:not(.on) b{color:#8a5a2b}
.ml span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml b{font-size:13.5px;font-weight:800;color:var(--sub);white-space:nowrap}
.ml.on b{color:var(--deep)}
.ml-key{margin-top:2px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:700;color:var(--sub)}
.ml-key span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ml-key i{width:8px;height:8px;border-radius:50%;background:#a9ab9c}
.ml-key .sc{gap:2px}
.ml-key .sc i{width:10px;height:8px;border-radius:2px}
.ml-key .sc i:last-of-type{margin-right:3px}
.ml-key i.o{width:10px;height:10px;background:none;border:1.6px dashed #BA7517}
.ml-foot{margin-top:2px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--soil);display:flex;align-items:center;gap:6px}
.ml-foot::before{content:"";width:16px;border-top:2.5px dashed var(--soil);opacity:.7}
.mapx .ch{margin-bottom:8px}
.mapx{position:absolute;left:0;right:0;bottom:0;top:calc(50% + 7px);z-index:5;display:flex;visibility:hidden;opacity:0;pointer-events:none;flex-direction:column;padding:14px 16px;min-height:0;overflow:hidden;box-shadow:0 18px 40px -20px rgba(40,40,20,.35)}
.mapx.open{visibility:visible;opacity:1;pointer-events:auto;animation:mxin .32s var(--ease) both}
@keyframes mxin{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.mx-close{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:#fff;background:var(--deep);padding:6px 10px;border-radius:8px;margin-left:8px}
.mx-close:hover{background:var(--g)}
.mx-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
.mx-grid .mapbox{height:100%}
.mx-side{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:12px;padding:10px 0 0;overflow:hidden}
.mx-side .store-list{grid-auto-rows:34px;max-height:none;overflow-y:auto;scrollbar-width:thin}
.mx-side .stores .fr{font-size:13.5px}
.mx-side h4{font-size:15px;font-weight:800;padding:0 14px 8px}
.mx-side .stores .fh{padding-top:2px}
.mapwrap .ac{fill:rgba(15,149,71,.14);stroke:var(--g)}
.mapwrap .ac.plan{fill:rgba(255,255,255,.5);stroke:#6fcb8e}
.mapwrap .shop.off{fill:#fff;stroke:#9fdcb3}
.mapwrap .shop.me{fill:#ffd43a;stroke:var(--deep)}
 .mapwrap .shop{transition:fill .4s}
.mapx .shop,.mapx .ac,.mapx .route,.mapx .farm-tag,.mapx path.dots,.mapx .dlab{display:none}
.mapwrap path.opline{fill:none;stroke:#5fbf80;stroke-width:1.2;pointer-events:none}
.mapwrap .gc{stroke:none}
.mapx .mapbox{cursor:grab;touch-action:none}
.mapwrap.dragging{transition:none;cursor:grabbing}
.mapwrap .gc.hot{animation:gch 1.6s ease-out}
@keyframes gch{0%{fill:#ffd43a}100%{}}
.scale{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--sub);margin:0 6px}
.scale i{width:14px;height:10px;border-radius:2px;display:inline-block}
.scale i:first-of-type{margin-left:4px}.scale i:last-of-type{margin-right:4px}
#gseg{margin-right:4px}
.rname{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--sub);padding-left:18px;border-left:1px solid var(--line);white-space:nowrap}
.rname b{color:var(--ink);font-weight:800}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#fff;white-space:nowrap;margin-left:8px}
.ctl.first{margin-left:auto}
.ctl svg{width:15px;height:15px;fill:none;stroke:var(--sub);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{display:block;width:100%;text-align:left;padding:12px 16px 10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);transition:border-color .2s,box-shadow .2s}
.kpi.on{border-color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
.kpi:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.kpi .lb{font-size:13px;font-weight:700;color:var(--sub)}
.kpi .kv{display:flex;align-items:baseline;gap:4px;margin-top:3px}
.kpi .kv .roll{font-size:30px;font-weight:800;letter-spacing:-.8px}
.kpi .kv small{font-size:14px;font-weight:700;color:var(--sub)}
.dl{margin-left:auto;align-self:center;font-size:12.5px;font-weight:800;color:var(--g);background:var(--g2);padding:3px 7px;border-radius:7px;white-space:nowrap}
.dl.dn{color:#b4432f;background:#fbe9e3}
.spk{display:block;width:100%;height:26px;margin-top:6px}
.spk polyline{fill:none;stroke:#7fc795;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.kpi.on .spk polyline{stroke:var(--g)}
.chartc,.tablec{padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chart{flex:1;min-height:0;position:relative}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .gl{stroke:#ebe8df;stroke-width:1}
.chart .yl,.chart .xl{font-size:12px;fill:#9a9e92;font-weight:600}
.chart .cur{fill:none;stroke:var(--g);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:rgba(15,149,71,.08)}
.chart .prev{fill:none;stroke:#b8baad;stroke-width:2;stroke-dasharray:5 5}
.chart .dot{fill:var(--g);stroke:#fff;stroke-width:3}
.chart .vl{font-size:14px;font-weight:800;fill:var(--deep)}
.chart .dot.hot{animation:dotp 1.6s ease-out}
.chart .ev{stroke:#c9a47c;stroke-width:1.2;stroke-dasharray:2 3}
.chart .evt{font-size:12px;font-weight:700;fill:var(--soil)}
.chart .xl.hol{fill:var(--soil)}
.chart .wb{opacity:.92}
.chart .wb.now{opacity:1}
.chart .wb.hot{animation:barp 1.4s ease-out}
@keyframes barp{0%{opacity:.35}100%{opacity:1}}
.lg .k i.sq{width:11px;height:11px;border-radius:3px}
@keyframes dotp{0%{stroke-width:9;stroke:#c5ebd0}100%{stroke-width:3;stroke:#fff}}
.lg .k i.ln{width:16px;height:0;border-radius:0;background:none;border-top:2.5px solid var(--g)}
.lg .k i.ln.p{border-top:2.5px dashed #b8baad}
.rt-top{display:flex;align-items:flex-end;gap:16px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.rt-n{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.rt-n .roll{font-size:28px;font-weight:800;letter-spacing:-.6px}
.rt-n small{font-size:13px;color:var(--sub);font-weight:700}
.rt-n small+small{margin-left:6px}
.rt-bars{flex:1;display:flex;align-items:flex-end;gap:3px;height:38px}
.rt-bars i{flex:1;min-height:3px;border-radius:3px 3px 0 0;background:#9fdcb3;transition:height .4s var(--ease)}
.rt-bars i.z{background:#ebe8df}
.rt-bars i.now{background:var(--g)}
.rtc>.fh{display:none}
.rtc .feed .fr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 58px}
.rtc .feed .fr .c4{display:none}
.rtc [hidden]{display:none}
.seg{display:flex;gap:2px;background:#efede6;border-radius:9px;padding:2px}
.seg button{font-size:12.5px;font-weight:700;color:var(--sub);padding:4px 11px;border-radius:7px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dt{flex:1;min-height:0;display:flex;flex-direction:column}
.dr.tot{background:#faf8f3;border-bottom:0}
.dr{flex:1;max-height:64px;min-height:0;display:grid;grid-template-columns:var(--cols);column-gap:16px;align-items:center;padding:0 4px;font-size:14px;font-weight:700;border-bottom:1px solid #f0ede5}
.dr.dh{flex:none;height:30px;font-size:12.5px;color:#7a7f72;border-bottom:1px solid var(--line)}
.dr>*{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .r{text-align:right}
.dr .nm{display:flex;align-items:center;gap:7px}
.dr .nm img{width:24px;height:24px;flex:none}
.dr .bv{display:flex;align-items:center;gap:9px}
.dr .bv .tr{flex:1;height:8px;border-radius:4px;background:#efede6;overflow:hidden}
.dr .bv .tr i{display:block;height:100%;background:var(--g);border-radius:inherit;transition:width .45s var(--ease)}
.dr .bv b{font-weight:800;font-size:13.5px;min-width:68px;text-align:right}
.dr .spk{height:24px;margin:0}
.dr .up{color:var(--g)}
.dr .dn{color:#b4432f}
.dr .farm{color:var(--soil)}
.dr .sub{color:var(--sub);font-weight:600;font-size:13px}
.dr .ics{display:flex;gap:3px}
.dr .ics img{width:22px;height:22px}
.dr .ok,.dr .wait{justify-self:end;font-size:12px;font-weight:800;padding:3px 8px;border-radius:7px}
.dr .ok{color:#fff;background:var(--g)}
.dr .wait{color:var(--sub);background:#efede6}
.rcol{display:grid;grid-template-rows:minmax(0,50fr) minmax(0,50fr);gap:14px;min-width:0;min-height:0}
.lcol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;min-height:0}
.mapc{padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch h3{font-size:17px;font-weight:800}
.map-heading{display:flex;align-items:center;gap:10px}
.map-all{font-size:12px;font-weight:800;color:var(--g);background:var(--g2);padding:4px 8px;border-radius:7px;white-space:nowrap}
.lg{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--sub);font-weight:700}
.lg .k{display:inline-flex;align-items:center;gap:6px}
.lg .k i{width:12px;height:12px;border-radius:50%;background:var(--g)}
.lg .k i.c{background:#fff;border:2px solid #6fcb8e}
.lg .k i.r{width:18px;height:0;border-radius:0;background:none;border-top:2.5px dashed var(--soil);opacity:.7}
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip;border-radius:12px;background:#eef0e4}
@property --map-scale{syntax:"<number>";inherits:true;initial-value:1}
@property --map-x{syntax:"<percentage>";inherits:false;initial-value:0%}
@property --map-y{syntax:"<percentage>";inherits:false;initial-value:0%}
.mapwrap{position:absolute;inset:0;isolation:isolate;--mark-scale:calc(1 / var(--map-scale));transform-origin:0 0;transform:translate(var(--map-x),var(--map-y)) scale(var(--map-scale));transition:--map-x 550ms var(--ease),--map-y 550ms var(--ease),--map-scale 550ms var(--ease)}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mapwrap path{fill:#e8e8dc;stroke:#c7c6b4;stroke-width:1.2;transition:fill .4s var(--ease)}
.mapwrap path.op{fill:url(#opf);stroke:#5fbf80;stroke-width:1}
.mapwrap path.dots{fill:url(#dots);stroke:none;pointer-events:none}
.mapwrap .route{fill:none;stroke:var(--soil);stroke-linecap:round;opacity:.55}
.mapwrap .route.go{stroke:var(--g);opacity:1}
.mapwrap .route.full:not(.go){stroke:var(--g);opacity:.85;stroke-dasharray:none}
.mapwrap.farmsel .route:not(.sel){opacity:.18}
.mapwrap.farmsel .route.sel{stroke:var(--g);opacity:1}
.farm-tag .ship{font-size:12px;font-weight:800;color:#fff;background:var(--g);border-radius:99px;padding:2px 7px;margin-left:2px}
.farm-tag .ship:empty{display:none}
.farm-tag:not(.full) .ship{background:var(--soil2);color:var(--soil)}
.farm-tag.full{color:var(--deep);box-shadow:0 0 0 1.5px #6fcb8e,0 3px 8px -4px rgba(0,0,0,.3)}
.farm-tag[aria-pressed="true"]{background:var(--deep);color:#fff;box-shadow:0 0 0 2px var(--deep)}
.farm-tag:focus-visible{outline:2px solid var(--g);outline-offset:3px}
.mapwrap .shop{fill:var(--g);stroke:#fff}
.dlab{position:absolute;transform:translate(-50%,-50%) scale(var(--mark-scale));font-size:12px;font-weight:700;color:#a9ab9c;white-space:nowrap;pointer-events:none;letter-spacing:-.2px}
.farm-tag{position:absolute;z-index:2;transform:translate(-50%,-50%) scale(var(--mark-scale));display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:99px;background:#fffdf7;box-shadow:0 0 0 1px var(--soil2),0 3px 8px -4px rgba(90,60,20,.35);font-size:13px;font-weight:800;color:var(--soil);white-space:nowrap;cursor:pointer;font-family:inherit;transition:box-shadow .3s,color .3s,background .3s}
.farm-tag img{width:24px;height:24px;border-radius:50%;background:#f4ecdc;padding:2px;display:block}
.farm-tag.go{color:var(--deep);box-shadow:0 0 0 2px var(--g),0 3px 8px -4px rgba(0,0,0,.3)}
.pin{position:absolute;z-index:2;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%) scale(var(--mark-scale));transition:opacity .24s var(--ease)}
.pin::before{content:"";width:15px;height:15px;border-radius:50%;background:var(--g);border:2px solid #fff;box-shadow:0 0 0 1px var(--g)}
.pin.plan::before{background:#fff;border-color:#6fcb8e;box-shadow:none}
.pin:hover::before,.pin[aria-pressed="true"]::before{box-shadow:0 0 0 3px #9fdcb3}
.pin-label{position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:3px;white-space:nowrap;color:var(--deep);background:#fff;border-radius:8px;box-shadow:0 0 0 1px var(--g3),0 2px 6px rgba(0,0,0,.13);padding:6px 9px;font-size:14px;font-weight:800;transition:background .24s var(--ease),color .24s var(--ease)}
.pin.gate .pin-label{left:calc(100% + 52px);bottom:50%;transform:translateY(50%);font-size:16px}
.pin.gate .pin-label::before{content:"";position:absolute;right:100%;top:50%;width:62px;border-top:2px solid var(--deep)}
.pin.market .pin-label{left:auto;right:calc(100% + 3px);bottom:50%;transform:translateY(50%)}
.pin-label .roll{color:var(--g)}
.mapwrap.focused .pin[aria-pressed="false"]{opacity:.42}
.pin[aria-pressed="true"],.pin:focus-visible{z-index:3}
.pin[aria-pressed="true"] .pin-label,.pin.hot .pin-label{background:var(--deep);color:#fff}
.pin[aria-pressed="true"] .roll,.pin.hot .roll{color:#fff}
.rip{position:absolute;border-radius:50%;border:2.5px solid var(--g);transform:translate(-50%,-50%) scale(var(--mark-scale));animation:rip 1.3s ease-out forwards;pointer-events:none}
.pin:focus-visible,.map-all:focus-visible{outline:2px solid var(--g);outline-offset:3px}

/* order record table */
.feedc{padding:14px 0 0;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.feedc .ch{padding:0 16px;min-height:24px;margin-bottom:6px;gap:8px}
.feed-note{color:var(--sub);font-size:12px;font-weight:700;white-space:nowrap}
.fh,.fr{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,1fr) 64px 58px;column-gap:10px;align-items:center}
.fh{padding:0 14px 8px 17px;font-size:13.5px;font-weight:800;color:#636859;border-bottom:1px solid var(--line)}
.fh>*,.fr>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh .c4,.fr .c4{text-align:center}
.fh .c5,.fr .c5{text-align:right}
.feed{flex:1;min-height:0;overflow:hidden;position:relative}
.fi{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease-in-out}
.fi.in{grid-template-rows:1fr}
.fi.cut{display:none}
.fi>div{overflow:hidden}
.fr{padding:calc(7px + var(--fx,0px)) 14px;border-left:3px solid transparent;border-bottom:1px solid #efede6;font-size:13.5px;font-weight:600;color:var(--sub);opacity:0;transition:opacity .25s}
.fi.in .fr{opacity:1}
.fi.in.hl .fr{animation:hl2 1.8s ease-out}
.fr .c1{font-size:15px;font-weight:800;color:var(--ink)}
.fr .c3{font-size:14.5px;font-weight:800;color:var(--g);display:flex;align-items:center;gap:5px}
.fr .c3 img{width:22px;height:22px;flex:none;display:block;user-select:none}
.fr .c3 em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.fr .c4{font-weight:800;color:var(--ink)}
.fr .c4 i{font-style:normal;font-size:12px;padding:3px 7px;border-radius:7px;background:#efede6;color:#555a50}
.fi.mine .fr .c4 i{background:rgba(255,255,255,.6)}
.fr .c5{font-size:14px;font-weight:700;color:#666b60}
.fi.mine .fr{border-left:6px solid var(--g);background:var(--mine);padding-inline-start:11px;color:var(--deep)}
.fi.mine .fr>*{color:var(--deep)}
.fi.mine .fr .c1{font-size:16px}
.fi.mine.in.hl .fr{animation:hlm 2.4s ease-out}
.feedc [hidden]{display:none}
.feed-title-in{display:inline-block;animation:store-in 240ms ease-out both}
.stores{flex:1;min-height:0;display:flex;flex-direction:column}
.store-list{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);max-height:calc(var(--store-count) * 52px);overflow:hidden}

.admin .card:hover{transform:none;box-shadow:none}
.admin .rc{transition-duration:.45s}

/* number roll */
function roll(el,n,f){
  const s=f?f(n):fmt(n);if(el._s===s)return;
  const ch=[...s];
  if(!el._c||el._s.length!==s.length){
    el.classList.add('roll');el.innerHTML='';el._c=[];
    ch.forEach(c=>{
      if(/\d/.test(c)){const w=document.createElement('span');w.className='rd';const col=document.createElement('span');col.className='rc';col.innerHTML='0123456789'.split('').map(d=>`<span>${d}</span>`).join('');w.appendChild(col);el.appendChild(w);el._c.push(col)}
      else{const sp=document.createElement('span');sp.className='rs';sp.textContent=c;el.appendChild(sp);el._c.push(null)}
    });el.offsetHeight;
  }
  ch.forEach((c,i)=>{const col=el._c[i];if(col){col.style.transitionDelay=el.closest('.admin')?'0ms':(i*35)+'ms';col.style.transform=`translateY(${-Number(c)*10}%)`}});

}

    rows=[...farm.stores].sort((a,b)=>b[1]-a[1]).map(([store,q])=>[store,`${q}kg`,`${farm.day}요일`]);
    rows.push(['합계',`${farm.cur} / ${farm.goal}kg`,farm.cur>=farm.goal?'발주 확정':'모집 중']);
  }else if(active){
    headers=['점포','이번 주 주문량','주문 건수'];
    rows=[ME.store,...ST,...IDLE].map(store=>{const stats=S.storeOrders.get(store);return [store,stats?`${fmt(stats.qty)}kg`:'-',`${stats?.count??0}건`]});
  }else{
    headers=['점포','업종','상태'];rows=area.stores.map(([store,type])=>[store,type,'후보']);
  }
  stores.innerHTML=`<div class="fh" role="row">${headers.map(h=>`<span role="columnheader">${h}</span>`).join('')}</div>`+
    `<div class="store-list" role="rowgroup" style="--store-count:${rows.length}">${rows.map(([store,value,status],i)=>
      `<div class="fr${store===ME.store?' mine':''}${farm&&i===rows.length-1?' sum-row':''}" role="row" style="--i:${i}"><span class="c1" role="cell">${store}</span><span${qty&&value!=='-'?' class="store-qty"':''} role="cell">${value}</span><span${qty&&!(farm&&i===rows.length-1)?'':' class="store-status"'} role="cell">${status}</span></div>`).join('')}</div>`;
}
const FEED_MAX=16;
/* rows that fit (max FEED_MAX) share the leftover height as padding */
function fitFeed(){
  if(feed.hidden)return;
  const H=feed.clientHeight,items=$$('.fi',feed);
  feed.style.setProperty('--fx','0px');
  items.forEach(row=>row.classList.remove('cut'));
  let acc=0,n=0;
  for(let i=0;i<items.length&&i<FEED_MAX;i++){const fr=items[i].querySelector('.fr'),h=fr?fr.offsetHeight:44;if(acc+h>H+1)break;acc+=h;n++}
  const fx=n?Math.min(3,Math.max(0,Math.floor((H-acc)/n/2))):0;feed.style.setProperty('--fx',fx+'px');
  items.forEach((li,i)=>li.classList.toggle('cut',i>=n));
}
function addFeed(o,instant){
  const li=document.createElement('div');li.className='fi'+(o.mine?' mine':'');li.dataset.t=o.t||Date.now();
  li.innerHTML=`<div><div class="fr"><span class="c1">${o.store}</span><span class="c3">${pic(o.item)}<em>${IT[o.item].n} ${o.qty}kg</em></span><span class="c4"><i>${BOF(o.item).day}요일</i></span><span class="c5"></span></div></div>`;
  if(!o.mine&&pinned&&pinned.parentNode===feed)pinned.after(li);else feed.prepend(li);
  if(instant)li.classList.add('in');else{const f=requestAnimationFrame(()=>{RAF.delete(f);const f2=requestAnimationFrame(()=>{RAF.delete(f2);li.classList.add('in','hl')});RAF.add(f2)});RAF.add(f)}
  while(feed.children.length>24)feed.lastChild.remove();ftime();fitFeed();
  return li;
}
function ftime(){const now=Date.now();$$('.fi',feed).forEach(li=>{const s=Math.floor((now-li.dataset.t)/1000);$('.c5',li).textContent=s<5?'방금':s<60?s+'초 전':s<3600?Math.floor(s/60)+'분 전':s<86400?Math.floor(s/3600)+'시간 전':Math.floor(s/86400)+'일 전'})}
function seedFeed(){feed.innerHTML='';HIST.slice().sort((a,b)=>b[3]-a[3]).forEach(([st,it,q,m])=>addFeed({store:st,item:it,qty:q,t:Date.now()-m*60000},true))}

// KPI cards, weekly chart and realtime card share the live totals
S.metric=0;
const kpis=$('#kpis'),chart=$('#chart');
function buildAdmin(){
  kpis.innerHTML=KPI.map((k,i)=>`<button type="button" class="kpi card${i?'':' on'}" data-i="${i}" style="--d:${120+i*40}ms"><span class="lb">${k.lb}</span><span class="kv"><span class="roll"></span><small>${k.u}</small><span class="dl"></span></span><span class="spkw"></span></button>`).join('');
  kpis.addEventListener('click',e=>{const b=e.target.closest('.kpi');if(!b)return;S.metric=+b.dataset.i;$$('.kpi',kpis).forEach(x=>x.classList.toggle('on',x===b));renderChart()});
  $('#rtBars').innerHTML='<i></i>'.repeat(12);
}
function renderKpis(){
  $$('.kpi',kpis).forEach((el,i)=>{const k=KPI[i],c=k.cur(),d=delta(c,k.hist[k.hist.length-1],k.d);
    roll($('.roll',el),c);const dl=$('.dl',el);dl.textContent=d.t;dl.classList.toggle('dn',d.v<0);
    $('.spkw',el).innerHTML=spark([...k.hist,c])});
}
function renderChart(hot){
  const k=KPI[S.metric],cur=[...k.hist,k.cur()],prev=k.prev,n=cur.length;
  $('#chartT').textContent=`주별 ${k.lb.replace('주간 ','')}`;
  $('#chartLg').innerHTML=(k.stack?STACK.map(([id,c])=>`<span class="k"><i class="sq" style="background:${c}"></i>${IT[id].n}</span>`).join(''):'<span class="k"><i class="ln"></i>이번 기간</span>')+'<span class="k"><i class="ln p"></i>이전 기간</span>';
  const W=chart.clientWidth,H=chart.clientHeight;if(!W||!H)return;
  const L=34,Rp=46,T=26,B=24,top=Math.max(...cur,...prev)*1.1,raw=top/4,mag=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].map(m=>m*mag).find(v=>v>=raw),mx=step*4;
  const slot=(W-L-Rp)/n,x=i=>L+slot*(i+.5),y=v=>T+(H-T-B)*(1-v/mx),bw=Math.min(26,slot*.56);
  const pts=a=>a.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let marks='';
  if(k.stack){
    const wk=i=>Object.fromEntries(STACK.map(([id])=>[id,i<n-1?ITEM_HIST[id][i]:BOF(id).cur]));
    marks=cur.map((_,i)=>{const v=wk(i);let acc=0;return `<g class="wb${i===n-1?' now':''}${i===n-1&&hot?' hot':''}">`+STACK.map(([id,c],j)=>{const h=v[id],y0=y(acc),y1=y(acc+h);acc+=h;
      return h?`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y0-y1-(j<STACK.length-1?0:0)).toFixed(1)}" fill="${c}"${j===STACK.length-1?' rx="3"':''}/>`:''}).join('')+'</g>'}).join('');
  }else{
    marks=`<path class="area" d="M${x(0)},${y(0)} L${pts(cur).replaceAll(' ',' L')} L${x(n-1)},${y(0)}Z"/><polyline class="cur" points="${pts(cur)}"/><circle class="dot${hot?' hot':''}" cx="${x(n-1)}" cy="${y(cur[n-1])}" r="6"/>`;
  }
  const ticks=[0,1,2,3,4].map(j=>step*j);
  chart.innerHTML=`<svg>${ticks.map(t=>`<line class="gl" x1="${L}" x2="${W-Rp+8}" y1="${y(t)}" y2="${y(t)}"/><text class="yl" x="${L-8}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}
   ${EVENTS.map(([i,t])=>`<line class="ev" x1="${x(i)}" x2="${x(i)}" y1="${T-4}" y2="${y(0)}"/><text class="evt" x="${x(i)}" y="${T-10}" text-anchor="middle">${t}</text>`).join('')}
   ${marks}<polyline class="prev" points="${pts(prev)}"/>
   <text class="vl" x="${x(n-1)+(k.stack?bw/2+6:12)}" y="${y(cur[n-1])+5}">${cur[n-1]}${k.u}</text>
   ${Object.entries(WEEK_LABEL).map(([i,t])=>`<text class="xl${t==='추석'?' hol':''}" x="${x(+i)}" y="${H-4}" text-anchor="middle">${t}</text>`).join('')}</svg>`;
}
function renderRT(){
  roll($('#rtN'),S.rt.reduce((a,b)=>a+b,0));$('#rtKg').textContent=`${S.rtKg}kg`;
  const mx=Math.max(2,...S.rt);$$('#rtBars i').forEach((b,i)=>{const v=S.rt[i];b.style.height=(v?Math.max(18,v/mx*100):8)+'%';b.className=v?(i===11?'now':''):'z'});
}
const mini=$('#mini'),miniSvg=$('#miniSvg');
function buildMini(){
  const op=GEO.find(([d])=>d==='동대문구')[1];
  miniSvg.setAttribute('preserveAspectRatio','xMidYMid slice');
  miniSvg.innerHTML=`<defs><clipPath id="mclip"><path d="${op}"/></clipPath></defs>`+
    GEO.map(([d,path])=>`<path d="${path}"${d==='동대문구'?' class="op"':''}/>`).join('')+
    `<g id="mgrid" clip-path="url(#mclip)"></g><path class="opline" d="${op}"/>`;
  miniSvg._b=$('path.op',miniSvg).getBBox();
  const ps=[...miniSvg.querySelectorAll(':scope > path')];miniSvg._ps=ps;
  mini.insertAdjacentHTML('beforeend',GEO.map(([d],i)=>{if(d==='동대문구')return '';return `<span class="mdl" data-i="${i}">${d}</span>`}).join('')+
    CANDS.map(a=>`<span class="mring" data-a="${a.id}"></span>`).join(''));
  mini.insertAdjacentHTML('beforeend',[ME,...CANDS].map(a=>`<span class="mlab${a===ME?' on':''}" data-a="${a.id}">${a.area}</span>`).join(''));
}
function fitMini(){
  const W=mini.clientWidth,H=mini.clientHeight;if(!W||!H||!ME.x)return;
  /* same framing idea as before: the three market areas, cover the box so the neighbours fill the corners */
  const A=[ME,...CANDS],B=miniSvg._b,x0=B.x-6,y0=B.y-6,x1=B.x+B.width+6,y1=B.y+B.height+6;
  const k=Math.min(W/(x1-x0),H/(y1-y0)),fw=W/k,fh=H/k,vx=(x0+x1)/2-fw/2,vy=(y0+y1)/2-fh/2;
  miniSvg.setAttribute('viewBox',`${vx} ${vy} ${fw} ${fh}`);
  A.forEach(a=>{$$(`[data-a="${a.id}"]`,mini).forEach(el=>{el.style.left=(a.x-vx)*k+'px';el.style.top=(a.y-vy)*k+'px'})});
  /* neighbour names: only those whose centre falls inside the card with a margin */
  /* neighbour names: a point inside the district and inside the card, nearest the middle of the visible part */
  const op=$('path.op',miniSvg),mx0=vx+30/k,mx1=vx+fw-30/k,my0=vy+12/k,my1=vy+fh-12/k;
  $$('.mdl',mini).forEach(l=>{const el=miniSvg._ps[+l.dataset.i],b=el.getBBox(),ix0=Math.max(b.x,mx0),ix1=Math.min(b.x+b.width,mx1),iy0=Math.max(b.y,my0),iy1=Math.min(b.y+b.height,my1);
    let best=null;if(ix1>ix0&&iy1>iy0){const cx=(ix0+ix1)/2,cy=(iy0+iy1)/2;for(let a=0;a<=8;a++)for(let c=0;c<=8;c++){const px=ix0+(ix1-ix0)*a/8,py=iy0+(iy1-iy0)*c/8,pt=new DOMPoint(px,py);
      if(!el.isPointInFill(pt)||op.isPointInFill(pt))continue;const rx=24/k,ry=9/k;if([[rx,0],[-rx,0],[0,ry],[0,-ry],[rx,ry],[-rx,ry],[rx,-ry],[-rx,-ry]].some(([ox,oy])=>{const q=new DOMPoint(px+ox,py+oy);return !el.isPointInFill(q)||op.isPointInFill(q)}))continue;const d=(px-cx)**2+(py-cy)**2;if(!best||d<best.d)best={px,py,d}}}
    l.hidden=!best;if(best){l.style.left=(best.px-vx)*k+'px';l.style.top=(best.py-vy)*k+'px'}});
}

/* expanded map over the data area */
const mapx=$('#mapx');
function openMap(){if(mapx.classList.contains('open'))return;mapx.classList.add('open');mapx.inert=false;fitMap();renderAreaPanel();$('#mapClose').focus({preventScroll:true})}
function closeMap(){if(!mapx.classList.contains('open'))return;pan={x:0,y:0};setArea(null);positionMap();mapx.classList.remove('open');mapx.inert=true;$('#minic').focus({preventScroll:true})}
$('#minic').addEventListener('click',openMap);
$('#minic').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();openMap()}});
$('#mapClose').onclick=closeMap;
function renderAdmin(flash=true){
  renderKpis();renderChart(flash);renderRT();roll($('#pinN'),total());renderAreas();renderShops();renderGrid(flash);if(mapx.classList.contains('open'))renderAreaPanel();
}
new ResizeObserver(()=>renderChart()).observe(chart);

/* order event */
function applyOrder(store,item,qty){
  const bundle=BOF(item);
  bundle.cur+=qty;bundle.stores.set(store,(bundle.stores.get(store)??0)+qty);
  S.orderCount++;
  const stats=S.storeOrders.get(store)??{qty:0,count:0};
  stats.qty+=qty;stats.count++;
  S.storeOrders.set(store,stats);
}
function pushOrder(o){const bb=BOF(o.item);if(bb.cur>=bb.goal)return;o.qty=Math.min(o.qty,bb.goal-bb.cur);ITEMS.forEach(i=>{const x=BOF(i.id),r=Math.max(0,x.goal-x.cur-(i.id===o.item?o.qty:0));if(S.qty[i.id]>r)S.qty[i.id]=r});setArea(null);applyOrder(o.store,o.item,o.qty);renderAdmin();ripple();hotPin();addFeed(o);renderFarms();renderFund();renderMini()}

function clock(){const d=new Date(),p=n=>String(n).padStart(2,'0');$('#ptime').textContent=`${d.getHours()}:${p(d.getMinutes())}`;ftime()}
setInterval(clock,1000);clock();

/* fit: phone scale by height, admin zoom by available size */
let AZ=1;
function fit(){
  const W=innerWidth,H=innerHeight,ps=Math.min((H-36)/790,Math.max(1,W/1670)),cw=Math.round(430*ps);
  const raw=Math.min(1.6,(W-cw)/1000,H/900);AZ=Math.max(.6,raw);$('.admin').classList.toggle('scroll',raw<.6);
  const r=document.documentElement.style;r.setProperty('--ps',ps.toFixed(4));r.setProperty('--colw',cw+'px');r.setProperty('--az',AZ.toFixed(4));
}
fit();
let togT=null,togTok=0;
const togPhone=()=>{
  const h=$('.app').classList.toggle('hide'),tok=++togTok,st=$('.stage'),ph=$('.phone');clearTimeout(togT);
  if(h){cancelHold();st.inert=true}
  else{
    let ft=null;
    const done=()=>{ph.removeEventListener('transitionend',te);clearTimeout(ft);if(tok!==togTok||$('.app').classList.contains('hide'))return;st.inert=false;if(sheetOpen)$('#sheetGo').focus({preventScroll:true})};
    const te=e=>{if(e.target===ph&&e.propertyName==='transform')done()};
    ph.addEventListener('transitionend',te);ft=setTimeout(done,800);
  }
  togT=setTimeout(()=>window.dispatchEvent(new Event('resize')),700);
};
$('#tog').onclick=togPhone;

/* reset (R) */
function resetDemo(){
  pan={x:0,y:0};if(mapx.classList.contains('open')){setArea(null);mapx.classList.remove('open');mapx.inert=true}positionMap();
  TM.forEach(clearTimeout);TM=[];cancelHold();clearTimeout(S.cfT);clearTimeout(S.hotT);clearTimeout(togT);
  RAF.forEach(cancelAnimationFrame);RAF.clear();
  setArea(null);
  busy=false;sheetOpen=false;pinned=null;S.done={};
  hold.classList.remove('loading','done','pressing','shake');
  $('#scrim').classList.remove('show');$('#sheet').classList.remove('show');$('#scrim').inert=true;$('#sheet').inert=true;behind(false);
  $('#sheet').classList.remove('pending');$('#sheetT').textContent='';$('#rcpt').innerHTML='';
  $$('.cf,.rip').forEach(e=>e.remove());$$('.row.flash',ol).forEach(r=>r.classList.remove('flash'));
  pin.classList.remove('hot');$$('.route.go,.farm-tag.go').forEach(e=>e.classList.remove('go'));
  initData();renderOrder();seedFeed();
  if($('.app').classList.contains('hide'))togPhone();
  if(tab!==0)go(0);else renderFarms();
  ol.scrollTop=0;$('#p2').scrollTop=0;$('.panes').scrollLeft=0;
  S.metric=0;S.view='item';S.gridItem='all';$$('#gseg button').forEach((x,i)=>x.classList.toggle('on',!i));$$('.kpi').forEach((x,i)=>x.classList.toggle('on',!i));$$('#seg button').forEach((x,i)=>x.classList.toggle('on',!i));
  renderAdmin(false);renderFund();
}
document.addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='INPUT')return;
  if(e.code==='KeyH')togPhone();
  else if(e.code==='KeyR')resetDemo();
  else if(e.code==='KeyM')mapx.classList.contains('open')?closeMap():openMap();
  else if(e.key==='Escape'&&!sheetOpen)closeMap();
});
/* boot */
seedFeed();
renderOrder();placeTab();
renderMap();fitMap();buildAdmin();renderAdmin(false);renderTable();
new ResizeObserver(fitFeed).observe(feed);
new ResizeObserver(fitMap).observe(mapbox);
buildMini();new ResizeObserver(fitMini).observe(mini);renderShops();renderGrid();fitMini();
setTimeout(()=>{document.body.classList.remove('loading');renderFarms();renderFund();fitFeed()},950);
if(document.fonts)document.fonts.ready.then(()=>{fit();placeTab();fitMap();fitFeed()});
let rzF=0;window.addEventListener('resize',()=>{cancelAnimationFrame(rzF);rzF=requestAnimationFrame(()=>{fit();placeTab();fitFeed()})});
</script>
