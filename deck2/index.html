<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소쿠리 | 창업경진대회 발표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --blue:#0919b4; --navy:#06127e; --yellow:#fff000; --lemon:#fff59a;
  --paper:#f5f6f8; --ink:#15181a; --muted:#6b7280; --line:#e3e6ee;
  --ease:cubic-bezier(.2,.8,.2,1); --pad:86px;
}
* { box-sizing:border-box }
body {
  margin:0; overflow:hidden; background:var(--paper); color:var(--ink);
  font:26px/1.43 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-variant-numeric:tabular-nums; word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
body.idle, body.idle * { cursor:none !important }
#stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; overflow:hidden; background:white }
.slide {
  position:absolute; inset:0; overflow:hidden; background:#fff;
  opacity:0; visibility:hidden; transform:scale(.988); filter:blur(4px); pointer-events:none;
  transition:opacity .45s var(--ease), transform .45s var(--ease), filter .45s var(--ease), visibility 0s .45s;
}
.slide.cur { opacity:1; visibility:visible; transform:none; filter:none; pointer-events:auto; transition-delay:0s }
.slide.blue { background:var(--blue); color:white }
.slide[inert] { user-select:none }
h1,h2,h3,p,figure { margin:0 }
img { display:block; max-width:100% }
a { color:inherit }
button { font:inherit }
header {
  position:absolute; top:50px; left:var(--pad); right:var(--pad); height:57px;
  display:flex; align-items:flex-start; justify-content:space-between;
  border-bottom:1px solid var(--line); color:var(--navy); font-size:22px; font-weight:700;
}
.header-brand { display:flex; align-items:center; gap:20px; letter-spacing:.055em }
.header-num { border-left:1px solid var(--line); padding-left:20px; color:var(--muted); letter-spacing:0 }
.blue header,.blue .header-num { color:#fff; border-color:#ffffff59 }
.layout {
  position:absolute; top:185px; bottom:146px; left:var(--pad); right:var(--pad);
  display:grid; grid-template-columns:40% 56%; justify-content:space-between; align-items:center;
}
.copy { align-self:start; padding-top:51px; min-width:0 }
h1 { font-size:52px; line-height:1.13; font-weight:800; letter-spacing:-.043em }
.conclusion { margin-top:37px; font-size:34px; line-height:1.34; letter-spacing:-.028em; font-weight:750; color:var(--blue) }
.conclusion,.point { display:grid; grid-template-columns:22px minmax(0,1fr); gap:14px; align-items:baseline }
.square { width:16px; height:16px; border:2.5px solid currentColor; display:inline-block; align-self:start; margin-top:14px }
mark {
  color:inherit; padding:0 .055em; margin:0 -.055em;
  background:linear-gradient(var(--yellow),var(--yellow)) left 94% / 0 31% no-repeat;
  transition:background-size .45s var(--ease) .14s;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
}
.on mark { background-size:100% 31% }
.points { margin:29px 0 0; padding:0; list-style:none; display:grid; gap:22px }
.point { font-size:26px; line-height:1.44; letter-spacing:-.016em }
.point::before { content:""; width:10px; height:10px; border:2px solid var(--blue); border-radius:50%; margin-left:2px }
.note { margin:22px 0 0 36px; font-size:22px; color:var(--muted); letter-spacing:-.012em }
.tight .points { gap:17px }
.tight .point { font-size:24px }
.fig { min-width:0; height:100%; display:flex; flex-direction:column; justify-content:center }
figcaption { font-size:20px; color:var(--muted); margin:0 0 17px; font-weight:600 }
.graphic { width:100%; min-height:0 }
.round { border-radius:10px }
.source {
  position:absolute; left:var(--pad); right:var(--pad); bottom:66px; min-height:40px;
  padding-top:13px; border-top:1px solid var(--line); color:var(--muted); font-size:15px; line-height:1.38;
}
[data-step] { opacity:0; visibility:hidden }
.a {
  transform:translateY(12px);
  transition:opacity .45s var(--ease), transform .45s var(--ease), visibility 0s .45s;
}
.a.on { opacity:1; visibility:visible; transform:none; transition-delay:var(--d,0s) }
.draw { opacity:0; visibility:visible; stroke-dasharray:1; stroke-dashoffset:1; transition:opacity .16s,stroke-dashoffset .55s var(--ease) }
.draw.on { opacity:1; stroke-dashoffset:0; transition-delay:var(--d,0s) }
.outline { opacity:0; scale:.84; transition:opacity .4s,scale .5s var(--ease) }
.outline.on { opacity:1; visibility:visible; scale:1 }
.fill { transform:scaleX(0); transform-origin:left; transition:transform .65s var(--ease) var(--d,0s) }
.fill.up { transform:scaleY(0); transform-origin:bottom }
.on > .fill,.on > .track > .fill,.on > .column > .fill { transform:none }
.count-print { display:none }
.accent { transition:color .4s var(--ease),border-color .4s var(--ease),background-color .4s var(--ease) }
.accent.active { color:var(--blue); border-color:var(--blue) }
.wide { position:absolute; left:var(--pad); right:var(--pad); top:156px; bottom:133px }
.nav {
  position:absolute; z-index:2; right:60px; bottom:14px; display:flex; align-items:center; gap:11px;
  font-size:16px; color:var(--muted);
}
.nav button {
  width:46px; height:34px; padding:0; display:grid; place-items:center; color:inherit;
  border:1px solid var(--line); border-radius:6px; background:transparent; cursor:pointer;
}
.nav button:disabled { opacity:.34; cursor:default }
.nav button:hover:not(:disabled) { color:var(--blue); background:var(--paper) }
.nav svg { width:16px; height:16px }
:focus-visible { outline:3px solid #6776e6; outline-offset:4px }
#stage.on-blue .nav { color:white }
#stage.on-blue .nav button { border-color:#ffffff66 }
.progress { position:absolute; z-index:3; inset:auto 0 0; height:4px; background:#8996df35 }
.progress span { display:block; height:100%; width:0; background:var(--blue); transition:width .35s var(--ease) }
.on-blue .progress span { background:var(--yellow) }
.hero {
  position:absolute; inset:160px var(--pad) 127px; display:grid; grid-template-columns:1fr 465px; align-items:center; gap:100px;
}
.hero h1 { font-size:174px; line-height:1.19; letter-spacing:-.075em }
.hero p { font-size:43px; font-weight:650; line-height:1.27; letter-spacing:-.035em; margin-top:44px }
.hero img { width:425px; justify-self:center }
.cover-credit { position:absolute; bottom:107px; left:var(--pad); font-size:25px; color:#e2e6ff }
.closing { position:absolute; inset:172px var(--pad) 138px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start }
.closing .name { font-size:48px; font-weight:800; margin-bottom:37px }
.closing h1 { font-size:97px; line-height:1.16 }
.closing h1 span { color:var(--yellow); display:block }
.closing p { font-size:34px; color:#e2e6ff; margin-top:57px }
.qr { position:absolute; bottom:119px; right:var(--pad); display:grid; justify-items:end; gap:14px; font-size:19px; text-decoration:none }
.qr img { width:160px; height:160px; background:white; border-radius:10px }

.alley { position:relative; height:450px; overflow:hidden; background:var(--paper) }
.alley > img { width:100%; height:100%; object-fit:cover; object-position:50% 55% }
.orders { position:absolute; left:22px; bottom:22px; display:grid; grid-template-columns:repeat(2,max-content); gap:9px }
.order { font-size:20px; padding:7px 12px; border-radius:6px; background:#fff; font-weight:650 }
.orders.active .order { background:var(--blue); color:white }
.stack { margin-top:23px; padding-top:14px; border-top:1px solid var(--line) }
.stack-head { display:flex; justify-content:space-between; font-size:20px; font-weight:650; margin-bottom:8px }
.track { height:27px; background:var(--paper); overflow:hidden }
.stack .fill { width:100%; height:100%; display:flex }
.stack .fill span { flex-basis:var(--w); background:var(--tone) }
.stack-labels { display:flex; justify-content:space-between; gap:14px; margin-top:11px; font-size:19px }
.stack-labels span::before { content:""; display:inline-block; width:11px; height:11px; background:var(--tone); margin-right:8px }
.stack.active .stack-head { color:var(--blue) }
.farm-photo { display:grid; grid-template-columns:minmax(0,1fr) 222px; gap:27px; align-items:center }
.farm-photo img { width:100%; height:595px; object-fit:cover }
.farm-photo img.active { outline:4px solid var(--blue); outline-offset:-4px }
.farm-count { min-width:0; padding-left:24px; border-left:1px solid var(--line) }
.farm-count strong { font-size:111px; white-space:nowrap; line-height:1.02; letter-spacing:-.07em }
.farm-count strong small { font-size:47px; margin-left:7px }
.farm-count p { margin-top:14px; font-size:21px; color:var(--muted) }
.map { width:100%; aspect-ratio:1590/1050; position:relative; background:var(--paper); overflow:hidden }
.map > img,.map > svg { position:absolute; inset:0; width:100%; height:100% }
.map svg { font-size:21px; font-weight:700 }
.map .spot { fill:var(--navy); transition:fill .4s }
.map .map-area.active .spot { fill:var(--blue); stroke:white; stroke-width:3px }
.map-label { font-size:20px; position:absolute; background:#fff; padding:7px 12px; border-radius:6px; white-space:nowrap }
.map-label.active { background:var(--blue); color:white }
.map-label.example { left:18px; top:18px; color:var(--muted); font-size:18px }
.map-label.gate { left:54.5%; top:41.5%; color:var(--blue); font-weight:750 }
.map-label.north { left:19%; top:15% }
.map-label.west { left:9.5%; top:49% }
.network { position:relative; height:520px; border-block:1px solid var(--line); display:grid; grid-template-columns:1fr .92fr 1fr; align-items:center; text-align:center }
.network > svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
.network .node { z-index:1; justify-self:center; background:white; padding:8px }
.network .node h3 { font-size:24px }
.network .node strong { display:block; font-size:57px; line-height:1.15; margin-top:9px; white-space:nowrap; letter-spacing:-.045em }
.network .hub { width:164px; height:164px; padding:0; display:grid; place-items:center; color:white; background:var(--blue); border-radius:50%; font-size:39px; font-weight:800 }
.network .route-label { position:absolute; font-size:20px; color:var(--muted); white-space:nowrap }
.network .route-label.first { left:21%; top:33% }
.network .route-label.last { right:20%; bottom:32% }
.network .route-label.active { color:var(--blue) }

.order-flow { position:relative; height:550px; border-block:1px solid var(--line); display:grid; grid-template-columns:151px 350px 230px; justify-content:space-between; align-items:center }
.order-flow > svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
.order-list { list-style:none; margin:0; padding:0; display:grid; gap:18px; z-index:1 }
.order-list li { height:59px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:white; font-size:21px }
.order-list li.active { border-color:var(--blue); color:var(--blue); font-weight:750 }
.gauge { z-index:1; padding:23px; border:1px solid var(--line); border-radius:10px; background:white }
.gauge.active { border-color:var(--blue) }
.gauge h3 { font-size:23px; color:var(--blue) }
.gauge .detail { margin-top:7px; font-size:19px; color:var(--muted); white-space:nowrap }
.gauge .amount { margin:12px 0 8px; font-size:59px; line-height:1.12; letter-spacing:-.04em; font-weight:800 }
.gauge .amount small { font-size:27px; color:var(--muted); margin-left:4px }
.cells { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; height:18px }
.cells span { background:var(--paper); transition:background-color .35s var(--ease) }
.cells .active { background:var(--yellow) }
.confirm { font-size:20px; color:var(--blue); margin-top:11px; font-weight:750 }
.farm-end { z-index:1; text-align:center }
.farm-end img { width:230px; height:153px; object-fit:cover; margin-bottom:12px }
.farm-end h3 { font-size:23px }
.farm-end p { font-size:21px; margin-top:4px; color:var(--muted) }
.farm-end .on { color:var(--blue); font-weight:750 }

.demo.wide { top:128px; bottom:118px; display:flex; flex-direction:column; gap:14px }
.demo-strip { display:grid; grid-template-columns:120px 740px minmax(0,1fr); align-items:center; gap:22px }
.demo-strip h1 { font-size:43px }
.demo-strip .conclusion { font-size:28px; margin:0; gap:9px }
.demo-strip .square { margin-top:11px; width:14px; height:14px }
.demo-strip .points { margin:0; gap:4px }
.demo-strip .point { font-size:20px; gap:6px }
.demo-link { align-self:flex-end; font-size:18px; color:var(--blue); cursor:pointer }
.demo-window { position:relative; flex:1; min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--paper) }
.demo-window img,.demo-window iframe { position:absolute; inset:0; width:100%; height:100%; border:0 }
.demo-window img { object-fit:contain }
.demo-window iframe { visibility:hidden; background:white }
.demo-window iframe.ready { visibility:visible }

.quadrant { height:600px; position:relative }
.quadrant > svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
.axis-label { position:absolute; font-size:20px; color:var(--muted); font-weight:620 }
.position { position:absolute; display:flex; gap:12px; align-items:flex-start; color:var(--muted) }
.position::before { content:""; flex:none; width:16px; height:16px; margin-top:7px; background:#878d9b; border-radius:50% }
.position strong { display:block; color:var(--ink); font-size:24px }
.position span { font-size:19px }
.position img { margin-bottom:6px; width:81px; height:18px; object-fit:contain }
.position.active::before { outline:2px solid #aeb3c1; outline-offset:4px }
.position.active strong { font-weight:800; text-decoration:underline; text-underline-offset:4px }
.position.sokuri { color:var(--blue) }
.position.sokuri strong { color:var(--blue) }
.position.sokuri::before { background:var(--blue); width:22px; height:22px; margin-top:4px }
.position.sokuri.active::before { outline-color:var(--blue) }
.prices { display:grid; gap:14px; border-top:1px solid var(--line); padding-top:11px }
.price-row { display:grid; grid-template-columns:295px minmax(0,1fr) 169px; gap:12px; align-items:center; min-height:64px; border-bottom:1px solid var(--line); padding-bottom:9px }
.price-row .name { font-size:22px; font-weight:650; letter-spacing:-.02em }
.price-row .name img { display:inline-block; width:56px; height:16px; vertical-align:middle; object-fit:contain; margin-right:6px }
.price-row .track { height:24px; background:none }
.price-row .fill { height:100%; width:var(--w); background:#a9afbd }
.price-row.baseline .fill { background:#737b8e }
.price-row.sokuri { color:var(--blue) }
.price-row.sokuri .fill { background:var(--blue) }
.price-row .value { text-align:right; white-space:nowrap; font-size:24px; font-weight:750 }
.price-row .value span { font-size:18px; color:var(--muted); font-weight:550 }
.price-row.active .name,.price-row.active .value span { color:var(--ink) }
.price-row.active .fill { background:#767e90 }

.comparison .conclusion { margin-top:21px }
.compare-table { width:100%; border-collapse:separate; border-spacing:0; margin-top:29px; text-align:center; table-layout:fixed; font-size:24px }
.compare-table th:first-child { width:28%; text-align:left; padding-left:26px }
.compare-table thead th { height:99px; background:var(--paper); font-weight:700; border-bottom:1px solid var(--line) }
.compare-table thead th.sokuri { background:var(--blue); color:#fff; font-size:31px; border-radius:10px 10px 0 0 }
.compare-table thead img { margin:auto; width:132px; height:35px; object-fit:contain }
.logo-cell { display:grid; place-items:center; background:#fff; border-radius:8px; width:155px; height:48px; margin:0 auto 3px }
.logo-label { font-size:19px; color:var(--muted) }
.compare-table tbody tr > * { height:57px; border-bottom:1px solid var(--line) }
.compare-table tbody tr td:nth-child(2) { background:#f0f1ff; color:var(--blue) }
.compare-table svg { display:inline-block; width:23px; height:23px; vertical-align:middle; color:var(--muted) }
.compare-table td:nth-child(2) svg { color:var(--blue) }
.compare-table .distinct th,.compare-table .distinct td { background:#f5f6ff }
.compare-table .distinct-first > * { border-top:2px solid var(--blue) }
.compare-table .distinct-last > * { border-bottom:2px solid var(--blue) }
.compare-label { margin:15px 0 6px; font-size:20px; color:var(--blue); font-weight:750 }
.compare-label + .compare-table { margin-top:0 }
.compare-key { margin-top:15px; font-size:19px; color:var(--muted) }

.stairs { position:relative; height:590px; padding:16px 0 60px; display:grid; grid-template-columns:repeat(3,1fr); align-items:end }
.stairs::after { content:""; position:absolute; bottom:59px; left:0; right:0; border-bottom:1px solid var(--line) }
.stair { position:relative; height:var(--h); display:flex; flex-direction:column; align-items:flex-start; padding:19px 14px; background:var(--paper); border-top:4px solid #a7aebb; border-left:1px solid white }
.stair.active { background:#f0f1ff; border-top-color:var(--blue) }
.stair h3 { margin-top:17px; font-size:23px; line-height:1.24 }
.stair p { color:var(--muted); font-size:20px }
.stair strong { display:block; font-size:33px; margin-top:8px; letter-spacing:-.045em; transition:color .4s var(--ease) }
.stair.active strong { color:var(--blue) }
.stair small { font-size:18px; margin-top:4px }
.stair .year { position:absolute; bottom:-46px; left:14px; font-size:22px; font-weight:750 }

.market { height:650px; position:relative }
.market svg { width:100%; height:100%; overflow:visible }
.market text { font-family:inherit; fill:var(--ink) }
.market .market-value { font-size:33px; font-weight:800 }
.market .market-name { font-size:23px; font-weight:650 }
.market .target text { fill:var(--blue) }
.market .active .market-name { font-weight:800 }
.market .active .market-value { fill:var(--blue) }
.market .market-leader { fill:none; stroke:#7d87a3; stroke-width:2 }
.sales { height:610px; position:relative; padding:45px 18px 54px 76px }
.sales-grid { position:absolute; inset:45px 18px 54px 76px; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none }
.sales-grid div { height:1px; background:var(--line); position:relative }
.sales-grid span { position:absolute; right:100%; padding-right:14px; top:-13px; font-size:18px; color:var(--muted) }
.sales-bars { position:relative; height:100%; display:grid; grid-template-columns:1fr 1fr; justify-items:center; align-items:end }
.sales-bar { position:relative; width:235px; height:var(--h) }
.column { position:absolute; inset:0 }
.column .fill { height:100%; display:flex; flex-direction:column-reverse; color:white }
.segment { flex-basis:var(--h); display:grid; justify-items:center; align-content:center; gap:2px; background:var(--tone); font-size:21px; font-weight:650 }
.sales-bar .total { position:absolute; bottom:100%; margin-bottom:7px; color:var(--blue); font-size:36px; font-weight:800; text-align:center; width:100%; white-space:nowrap }
.sales-bar .year { position:absolute; top:100%; width:100%; text-align:center; padding-top:12px; font-size:22px; font-weight:700 }
.sales-bar.active .year { text-decoration:underline; text-underline-offset:5px }
.sales-bar .segment.active { outline:2px solid #ffffff9e; outline-offset:-2px }
.articles { display:grid; grid-template-columns:repeat(2,1fr); gap:18px }
.headline { min-height:242px; display:flex; flex-direction:column; justify-content:flex-start; gap:24px; padding:24px 22px; border:1px solid var(--line); border-radius:8px }
.headline h3 { font-size:29px; line-height:1.34; letter-spacing:-.035em }
.headline p { color:var(--muted); font-size:19px }
.headline.active { border-color:var(--blue) }
.reports { display:grid; grid-template-columns:1fr 1fr; gap:26px }
.report { border-top:3px solid #a7aebb; padding:20px 17px 14px; background:var(--paper) }
.report:first-child { border-color:var(--blue) }
.report.active { background:#f0f1ff }
.report h3 { font-size:27px; letter-spacing:-.025em }
.report .report-bars { height:258px; margin:26px 0 14px; border-bottom:1px solid #afb6c7; display:flex; gap:8px; align-items:end }
.report-bars span { height:var(--h); flex:1; background:#949cad }
.report:first-child .report-bars span { background:var(--blue) }
.report .cost { font-size:19px; color:var(--muted); display:grid; margin-top:14px }
.report .cost strong { font-size:30px; color:var(--ink) }
.report:first-child .cost strong { color:var(--blue) }

.team > h1 { margin-bottom:63px }
.team-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:39px }
.member { border-top:1px solid var(--line); padding:28px 22px 0 0 }
.portrait { display:grid; place-items:center; width:111px; height:111px; border-radius:50%; background:var(--blue); color:white; font-size:48px; font-weight:800 }
.member h2 { font-size:41px; margin-top:15px; letter-spacing:-.04em }
.member .role { font-size:25px; color:var(--blue); font-weight:750; margin-top:3px }
.member ul { padding-left:22px; margin:22px 0 0; display:grid; gap:12px; font-size:23px }
.member li::marker { color:var(--blue) }
.appendix h1 { margin-bottom:36px }
.appendix table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:24px; line-height:1.34 }
.appendix th,.appendix td { border-bottom:1px solid var(--line); vertical-align:middle; text-align:left; padding:12px 16px }
.appendix thead th { background:var(--paper); color:var(--navy); font-weight:750 }
.appendix tbody th { font-weight:650 }
.appendix .sum > * { color:var(--blue); font-weight:750; background:#f2f3ff }
.appendix .small { margin-top:20px; font-size:20px; color:var(--muted) }
.operations { display:grid; grid-template-columns:46% 50%; justify-content:space-between; gap:4%; font-size:23px }
.operations h2 { font-size:29px; color:var(--blue); border-bottom:1px solid var(--line); padding-bottom:13px }
.money-list { display:grid; gap:9px; margin-top:15px }
.money-list div { background:var(--paper); padding:10px 15px; border-radius:7px }
.money-list strong { display:block; font-size:24px }
.money-list svg { margin:auto; width:21px; height:20px; color:var(--blue) }

.refs ul { padding:0; margin:0; list-style:none; font-size:21px }
.refs li { padding:11px 0; border-bottom:1px solid var(--line); line-height:1.3 }

}
@page { size:20in 11.25in; margin:0 }

}

function updateNav() {
  const display = `${current + 1} / ${slides.length}`;

  if (pageNumber.textContent !== label) pageNumber.textContent = label;

function formatCount(value, decimals) {
  return value.toLocaleString("ko-KR", {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function stopCount(element) {
  cancelAnimationFrame(countJobs.get(element));
  countJobs.delete(element);
}
function animateCount(element, value, decimals = 0, from = 0, duration = 800) {
  stopCount(element);
  if (reduced.matches) {
    element.textContent = formatCount(value, decimals);
    return;
  }
  const start = performance.now();
  element.textContent = formatCount(from, decimals);
  function tick(now) {
    const fraction = Math.min(1, Math.max(0, (now - start) / duration));
    const eased = 1 - (1 - fraction) ** 3;
    element.textContent = formatCount(from + (value - from) * eased, decimals);
    if (fraction < 1) countJobs.set(element, requestAnimationFrame(tick));

  }

  }
  for (const element of activeSlide.querySelectorAll("[data-accent]")) {
    element.classList.toggle("active", step >= Number(element.dataset.accent));
  }
  for (const element of activeSlide.querySelectorAll("[data-count]")) {
    const threshold = Number(element.closest("[data-step]")?.dataset.step ?? 0);
    if (step < threshold) stopCount(element);
    else if (entering || oldStep < threshold) {

async function startDemo() {
  if (!navigator.onLine) return;
  const controller = new AbortController();
  demoController = controller;
  const timer = setTimeout(() => controller.abort(), 4500);
  try {
    // Browsers fire iframe load even for many failed navigations. Check HTTP first.
    const response = await fetch(demoURL, {method:"HEAD", signal:controller.signal});
    if (!response.ok || controller.signal.aborted || demoController !== controller) return;
    const frame = document.createElement("iframe");
    frame.title = "소쿠리 공동발주 시연";
    frame.addEventListener("load", () => {
      if (!controller.signal.aborted && navigator.onLine) frame.classList.add("ready");
      clearTimeout(timer);
    }, {once:true});
    controller.signal.addEventListener("abort", () => frame.remove(), {once:true});
    frame.src = demoURL;
    demoWindow.append(frame);
  } catch {
    // The screenshot already occupies the demo window.
  } finally {
    if (!demoWindow.querySelector("iframe") || demoController !== controller) clearTimeout(timer);
  }
}

function go(page, targetStep = 0) {
  if (page < 0 || page >= slides.length) return;
  const oldStep = step;
  const entering = page !== current;
  if (entering && current >= 0) {
    const oldSlide = slides[current];
    if (oldSlide.contains(document.activeElement)) document.activeElement.blur();
    oldSlide.classList.remove("cur");
    oldSlide.inert = true;
    oldSlide.querySelectorAll("[data-count]").forEach(stopCount);
    if (current === 5) stopCount(kilos);
    if (current === 6) stopDemo();
  }
  current = page;
  step = Math.min(maxStep(page), Math.max(0, targetStep));
  const activeSlide = slides[page];
  if (entering) {
    activeSlide.querySelectorAll(".on,.active").forEach(element => element.classList.remove("on","active"));
    activeSlide.inert = false;
    activeSlide.classList.add("cur");
    stage.classList.toggle("on-blue", activeSlide.classList.contains("blue"));
    if (page === 6) startDemo();
    // Commit the reset before the entrance transitions, even during rapid navigation.
    if (!reduced.matches) void activeSlide.offsetWidth;
    apply({entering, oldStep});

  else if (key === "Home") go(0);
  else if (key === "End") go(slides.length - 1, maxStep(slides.length - 1));
  else if (key.toLowerCase() === "f") fullscreen();
  else return;
  event.preventDefault();
});
